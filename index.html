<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fichero</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{
  --paper:#E5E6E2; --sheet:#FBFBF9; --panel:#F1F1EE;
  --ink:#17171B; --ink-soft:#5C5C66; --ink-faint:#8E8E97;
  --mimeo:#4A3DAE; --mimeo-wash:#D9D4F4; --mimeo-line:#B7AFE8;
  --rust:#A8442B; --rust-wash:#F3DBD4; --rust-soft:#E9C4BA;
  --verde:#2C6349; --verde-wash:#D7E6DE; --verde-soft:#B6D4C6;
  --ley:#8A6512; --ley-wash:#EFE2C0; --ley-line:#D6BE7E;
  --rule:#CBCBC4;
  --mono:ui-monospace,"SFMono-Regular","Menlo","Consolas","Liberation Mono",monospace;
  --serif:"Iowan Old Style","Charter","Georgia","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--mimeo);outline-offset:2px}
.hidden{display:none !important}
svg{display:block}

.shell{display:flex;flex-direction:column;height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px;background:var(--sheet);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand .name{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mimeo)}
.brand .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:transparent;color:var(--ink);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;padding:7px 12px;border-radius:2px;
  transition:background .12s,color .12s;white-space:nowrap}
.btn:hover{background:var(--ink);color:var(--sheet)}
.btn--key{border-color:var(--mimeo);background:var(--mimeo);color:#fff}
.btn--key:hover{background:#3C319A;color:#fff}
.btn--ghost{border-color:var(--rule);color:var(--ink-soft)}
.btn--ghost:hover{background:var(--rule);color:var(--ink)}
.btn--mini{padding:4px 8px;font-size:10.5px;letter-spacing:.07em}
.btn--drop{border-color:var(--rust-soft);background:var(--rust-wash);color:var(--rust)}
.btn--drop:hover{background:var(--rust-soft);color:#5E2113}
.btn--keep{border-color:var(--verde-soft);background:var(--verde-wash);color:var(--verde)}
.btn--keep:hover{background:var(--verde-soft);color:#17402D}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn svg{width:13px;height:13px}

.counters{display:flex;gap:14px;align-items:center}
.count{display:flex;flex-direction:column;line-height:1.1}
.count b{font-family:var(--mono);font-size:17px;font-weight:600}
.count span{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint)}
.count--ok b{color:var(--verde)} .count--gap b{color:var(--rust)} .count--ley b{color:var(--ley)}
.saved{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);opacity:0;transition:opacity .3s}
.saved.on{opacity:1}

.main{flex:1;display:flex;min-height:0}
.reading{flex:1;display:flex;min-width:0;background:var(--sheet)}
.ruler{width:30px;flex:none;border-right:1px solid var(--rule);position:relative;background:var(--panel)}
.ruler .lbl{position:absolute;top:8px;left:50%;transform:translateX(-50%) rotate(180deg);writing-mode:vertical-rl;
  font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);pointer-events:none}
.tick{position:absolute;left:6px;width:18px;height:2px;background:var(--mimeo);cursor:pointer;border-radius:1px}
.tick:hover{left:3px;width:24px;height:3px}
.tick.is-open{background:var(--rust)} .tick.is-done{background:var(--verde)}
.tick.is-sug{background:var(--rust-soft);height:1px} .tick.is-ley{background:var(--ley-line)}

.scroller{flex:1;overflow-y:auto;padding:40px 6vw 200px;min-width:0}
.doc{max-width:660px;margin:0 auto;font-family:var(--serif);font-size:17.5px;line-height:1.72;color:#232329}
.doc p{margin:0 0 1.05em}
.doc h1,.doc h2,.doc h3{font-family:var(--mono);font-weight:600;font-size:14px;text-transform:uppercase;margin:2.2em 0 .9em;color:var(--mimeo)}
mark.cit{background:var(--mimeo-wash);color:inherit;padding:.05em .1em;border-radius:1px;cursor:pointer;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;border-bottom:1.5px solid var(--mimeo-line)}
mark.cit:hover{background:var(--mimeo-line)}
mark.cit.is-sug{background:transparent;border-bottom:1.5px dashed var(--rust);color:var(--rust)}
mark.cit.is-sug:hover{background:var(--rust-wash)}
mark.cit.is-done{background:var(--verde-wash);border-bottom-color:var(--verde)}
mark.cit.is-ley{background:var(--ley-wash);border-bottom:1.5px solid var(--ley-line)}
mark.cit.is-active{box-shadow:0 0 0 2px var(--ink)}

.empty{max-width:520px;margin:6vh auto 0}
.empty h2{font-family:var(--mono);font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--mimeo);margin:0 0 14px}
.empty p{color:var(--ink-soft);margin:0 0 14px;font-size:14.5px;line-height:1.6}
.drop{border:1.5px dashed var(--mimeo-line);border-radius:3px;padding:34px 24px;text-align:center;background:var(--panel);margin:22px 0 14px}
.drop.is-over{background:var(--mimeo-wash);border-color:var(--mimeo)}
.paste{width:100%;min-height:120px;border:1px solid var(--rule);border-radius:3px;padding:12px;font-family:var(--serif);
  font-size:15px;background:var(--sheet);color:var(--ink);resize:vertical}
.mini-note{font-size:12.5px;color:var(--ink-faint);line-height:1.55}

.resizer{width:7px;flex:none;cursor:col-resize;background:var(--rule);position:relative;transition:background .12s}
.resizer::after{content:'';position:absolute;top:50%;left:2px;width:3px;height:38px;transform:translateY(-50%);
  border-left:1px solid var(--ink-faint);border-right:1px solid var(--ink-faint);opacity:.45}
.resizer:hover,.resizer.is-dragging{background:var(--mimeo-line)}

.panel{width:410px;flex:none;border-left:1px solid var(--rule);background:var(--panel);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--rule);background:var(--sheet)}
.tab{flex:1;border:0;background:transparent;padding:12px 4px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint);border-bottom:2px solid transparent}
.tab[aria-selected="true"]{color:var(--mimeo);border-bottom-color:var(--mimeo);background:var(--panel)}
.tab .dot{display:inline-block;min-width:16px;margin-left:4px;font-size:9px;background:var(--rust);color:#fff;border-radius:8px;padding:1px 4px}
.panel-sub{padding:10px 14px;border-bottom:1px solid var(--rule);background:var(--sheet)}
.search{width:100%;padding:7px 9px;border:1px solid var(--rule);border-radius:2px;font-family:var(--mono);font-size:12px;background:var(--panel);color:var(--ink)}
.panel-body{flex:1;overflow-y:auto;padding:14px}
.panel-foot{border-top:1px solid var(--rule);padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;background:var(--sheet)}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:10px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);margin:2px 0 9px}
.gap{margin-top:20px}
.blank{color:var(--ink-faint);font-size:13.5px;line-height:1.6;padding:8px 0}

/* tarjetas compactas */
.ficha{background:var(--sheet);border:1px solid var(--rule);border-left:3px solid var(--mimeo);border-radius:2px;padding:7px 9px;margin-bottom:6px}
.ficha.is-done{border-left-color:var(--verde)}
.ficha.is-open{border-left-color:var(--rust)}
.ficha.is-sug{border-left-style:dashed;border-left-color:var(--rust)}
.ficha.is-ley{border-left-color:var(--ley)}
.fr{display:flex;align-items:center;gap:7px}
.fk{flex:1;min-width:0;font-family:var(--mono);font-size:12.5px;font-weight:600;line-height:1.3;word-break:break-word}
.fn{flex:none;font-family:var(--mono);font-size:9px;color:var(--ink-faint);border:1px solid var(--rule);border-radius:8px;padding:0 5px}
.fa{flex:none;display:flex;gap:1px}
.ico{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border:0;background:transparent;
  color:var(--ink-faint);border-radius:3px;padding:0}
.ico svg{width:15px;height:15px}
.ico:hover{background:var(--rule);color:var(--ink)}
.ico.i-drop:hover{background:var(--rust-wash);color:var(--rust)}
.ico.i-keep:hover{background:var(--verde-wash);color:var(--verde)}
.ffrag{font-family:var(--serif);font-size:12.5px;color:var(--ink-faint);font-style:italic;margin-top:3px;line-height:1.4}
.fwarn{font-size:11px;color:var(--rust);margin-top:4px;line-height:1.4}
.fnote{font-size:11px;color:var(--ink-faint);margin-top:4px;line-height:1.4}

/* pestaña buscar */
.nav{display:flex;align-items:center;gap:8px}
.nav .arrow{flex:none;width:30px;height:30px;border:1px solid var(--rule);background:var(--panel);border-radius:2px;
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.nav .arrow:hover{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.nav .arrow[disabled]{opacity:.3;pointer-events:none}
.nav .who{flex:1;min-width:0;text-align:center}
.nav .who b{display:block;font-family:var(--mono);font-size:14px;font-weight:600;line-height:1.25;word-break:break-word}
.nav .who span{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.navbar{height:3px;background:var(--rule);margin-top:9px;border-radius:2px;overflow:hidden}
.navbar>div{height:100%;background:var(--mimeo);transition:width .25s}
.opt{background:var(--sheet);border:1px solid var(--rule);border-radius:2px;padding:10px 11px;margin-bottom:8px;position:relative}
.opt.is-bib{border-left:3px solid var(--verde)}
.opt.is-picked{border-color:var(--verde);box-shadow:0 0 0 1px var(--verde)}
.opt-tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);
  display:flex;gap:7px;align-items:center;margin-bottom:6px}
.opt-tag .k{background:var(--ink);color:var(--sheet);border-radius:8px;padding:1px 6px}
.opt-tag .ok{color:var(--verde)} .opt-tag .warn{color:var(--rust)}
.occ-b{border:0;background:transparent;color:var(--ink-faint);padding:0 1px;vertical-align:-3px;border-radius:2px}
.occ-b svg{width:13px;height:13px}
.occ-b:hover{background:var(--rule);color:var(--mimeo)}
.manual-open{width:100%;justify-content:center;margin-bottom:14px}
.manual{background:var(--sheet);border:1px solid var(--mimeo-line);border-radius:2px;padding:11px 12px;margin-bottom:14px}
.manual label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink-faint);margin:0 0 4px}
.manual label + *{margin-bottom:10px}
.manual-row{display:flex;gap:6px;margin-bottom:10px}
.manual-row input{flex:1;min-width:0;padding:7px 8px;border:1px solid var(--rule);border-radius:2px;
  font-family:var(--mono);font-size:12px;background:var(--panel);color:var(--ink)}
.manual textarea{width:100%;min-height:76px;font-family:var(--serif);font-size:14px;padding:8px;
  border:1px solid var(--rule);border-radius:2px;background:var(--panel);color:var(--ink);resize:vertical}
.manual-acts{display:flex;gap:6px;justify-content:flex-end}
.opt-ref{font-family:var(--serif);font-size:13.5px;line-height:1.5;color:var(--ink)}
.opt-ref em{font-style:italic}
a.ico{text-decoration:none}
.busy{font-size:13px;color:var(--mimeo);background:var(--sheet);border:1px dashed var(--mimeo-line);padding:14px;border-radius:2px}
.nores{font-size:13px;color:var(--ink-soft);background:var(--sheet);border:1px dashed var(--rule);padding:14px;border-radius:2px;line-height:1.5}
.alldone{text-align:center;padding:40px 10px}
.alldone h3{font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--verde);margin:0 0 8px}

/* pestaña exportar */
.bib-doc{font-family:var(--serif);font-size:14.5px;line-height:1.62}
.bib-item{position:relative;padding:4px 0 4px 1.7em;text-indent:-1.7em;border-radius:2px;margin-bottom:.45em}
.bib-item:hover{background:var(--sheet)}
.bib-ref{outline:0;border-radius:2px}
.bib-ref em{font-style:italic}
.bib-ref[contenteditable="true"]:focus{background:var(--sheet);box-shadow:0 0 0 2px var(--mimeo);padding:2px 4px}
.bib-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;text-indent:0;margin-top:2px;opacity:0;transition:opacity .12s}
.bib-item:hover .bib-meta,.bib-item:focus-within .bib-meta{opacity:1}
.badge{font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;border:1px solid var(--rule);
  border-radius:8px;padding:1px 6px;color:var(--ink-faint)}
.badge.b-bib{color:var(--verde);border-color:var(--verde-soft)}
.badge.b-auto{color:var(--mimeo);border-color:var(--mimeo-line)}
.pend-strip{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--rust-wash);border:1px solid var(--rust-soft);
  border-radius:2px;padding:9px 11px;margin-bottom:14px}
.pend-strip .n{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--rust);line-height:1}
.pend-strip .t{flex:1;font-size:12.5px;color:var(--rust);line-height:1.35;min-width:120px}

/* modales */
.veil{position:fixed;inset:0;background:rgba(23,23,27,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;overflow-y:auto}
.modal{background:var(--sheet);border-radius:3px;padding:20px;max-width:480px;width:100%;border:1px solid var(--ink);margin:auto}
.modal h3{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 12px;color:var(--mimeo)}
.modal label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:12px 0 4px}
.modal input[type=text],.modal textarea,.modal select{width:100%;padding:8px;border:1px solid var(--rule);border-radius:2px;font:inherit;background:var(--panel);color:var(--ink)}
.modal textarea{min-height:80px;font-family:var(--serif);resize:vertical}
.modal .row{display:flex;gap:8px;margin-top:18px;justify-content:flex-end;flex-wrap:wrap}
.modal .two{display:flex;gap:10px}
.modal .two>div{flex:1}
.check{display:flex;align-items:flex-start;gap:8px;margin:9px 0;font-size:13.5px;line-height:1.4}
.check input{margin-top:3px}
.check span small{display:block;color:var(--ink-faint);font-size:11.5px}
.cfg-group{border-top:1px solid var(--rule);padding-top:12px;margin-top:16px}
.cfg-group>h4{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 6px}
.preview{font-family:var(--serif);font-size:13.5px;line-height:1.55;background:var(--panel);border:1px solid var(--rule);
  border-radius:2px;padding:10px;max-height:150px;overflow-y:auto;margin-top:10px}
.preview em{font-style:italic}
.preview div{padding-left:1.6em;text-indent:-1.6em;margin-bottom:.5em}

.pop{position:absolute;z-index:40;background:var(--sheet);border:1px solid var(--ink);border-radius:3px;padding:4px;display:flex;gap:4px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--sheet);font-family:var(--mono);
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 16px;border-radius:2px;z-index:80;max-width:80vw;text-align:center}
.privacy{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink-faint);border-top:1px dotted var(--rule);
  padding-top:8px;margin-top:14px;line-height:1.6}

@media (max-width:900px){
  .resizer{display:none}
  .panel{position:fixed;inset:auto 0 0 0;height:66vh;width:100% !important;border-left:0;border-top:1px solid var(--ink);z-index:30;box-shadow:0 -6px 20px rgba(0,0,0,.12)}
  .panel.is-hidden{display:none}
  .scroller{padding:24px 18px 70vh}
  .doc{font-size:16.5px}
  .toggle-panel{position:fixed;right:14px;bottom:14px;z-index:55}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="name">Fichero</span><span class="tag" data-i18n="brand_tag"></span></div>
    <div class="counters" id="counters"></div>
    <span class="saved" id="saved"></span>
    <button class="btn btn--ghost" id="btnCfg" data-i18n="cfg"></button>
    <button class="btn btn--ghost" id="btnBib" data-i18n="load_bib"></button>
    <button class="btn btn--ghost" id="btnClear"></button>
  </header>

  <div class="main">
    <div class="reading">
      <div class="ruler" id="ruler"><span class="lbl" data-i18n="ruler_lbl"></span></div>
      <div class="scroller" id="scroller">
        <div class="empty" id="empty">
          <h2 data-i18n="empty_h"></h2>
          <p data-i18n="empty_p"></p>
          <div class="drop" id="drop">
            <p class="mini-note" data-i18n="drop_hint"></p>
            <button class="btn btn--key" id="btnPick" data-i18n="pick_file"></button>
          </div>
          <p class="mini-note" data-i18n="paste_hint"></p>
          <textarea class="paste" id="pasteBox"></textarea>
          <div style="margin-top:10px"><button class="btn" id="btnPaste" data-i18n="paste_btn"></button></div>
          <p class="privacy" data-i18n="privacy"></p>
        </div>
        <div class="doc" id="doc"></div>
      </div>
    </div>

    <div class="resizer" id="resizer"></div>

    <aside class="panel" id="panel">
      <div class="tabs" role="tablist">
        <button class="tab" id="tabList" role="tab" aria-selected="true"></button>
        <button class="tab" id="tabFind" role="tab" aria-selected="false"></button>
        <button class="tab" id="tabExp" role="tab" aria-selected="false"></button>
      </div>
      <div class="panel-sub" id="subList"><input class="search" id="qList" type="search" autocomplete="off"></div>
      <div class="panel-sub hidden" id="subFind"></div>
      <div class="panel-sub hidden" id="subExp"></div>
      <div class="panel-body" id="panelBody"></div>
      <div class="panel-foot" id="panelFoot"></div>
    </aside>
  </div>
</div>

<button class="btn btn--key toggle-panel hidden" id="togglePanel"></button>
<div class="pop hidden" id="pop"></div>
<input type="file" id="fileDoc" accept=".docx" class="hidden">
<input type="file" id="fileBib" accept=".bib,.bibtex,.txt" class="hidden">

<script>
/* ==========================================================================
   FICHERO v3 · un solo archivo, sin backend.
   Publicalo como index.html en Vercel, Netlify o GitHub Pages.
   ========================================================================== */

/* ------------------------------------------------------------------ íconos */
const SV = (d, extra='') => `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"
  stroke-linecap="round" stroke-linejoin="round" ${extra}>${d}</svg>`;
const ICON = {
  eye:   SV('<path d="M1.2 8S3.7 3.6 8 3.6 14.8 8 14.8 8 12.3 12.4 8 12.4 1.2 8 1.2 8z"/><circle cx="8" cy="8" r="1.9"/>'),
  pencil:SV('<path d="M11.4 2.3l2.3 2.3-8.2 8.2-3 .7.7-3 8.2-8.2z"/>'),
  trash: SV('<path d="M2.4 4.2h11.2M6 4.2V2.4h4v1.8M3.8 4.2l.7 9.4h7l.7-9.4"/>'),
  check: SV('<path d="M3 8.4l3.4 3.4L13 4.6"/>'),
  cross: SV('<path d="M4.2 4.2l7.6 7.6M11.8 4.2l-7.6 7.6"/>'),
  left:  SV('<path d="M10 3.2L5.2 8 10 12.8"/>'),
  right: SV('<path d="M6 3.2L10.8 8 6 12.8"/>'),

const deacc = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'');

function toast(msg){
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 2400);
}
async function copyText(txt, label){
  try { await navigator.clipboard.writeText(txt); toast(label || t('copied')); }
  catch(e){ const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta);
    ta.select(); document.execCommand('copy'); ta.remove(); toast(label || t('copied')); }
}
async function copyRich(html, plain){
  try {
    await navigator.clipboard.write([new ClipboardItem({
      'text/html': new Blob([html],{type:'text/html'}), 'text/plain': new Blob([plain],{type:'text/plain'}) })]);
    toast(t('copied'));
  } catch(e){ copyText(plain); }

/* =========================================================================

   Trampas: varias citas por paréntesis (con ; o con ,), año sin coma previa,
   apellidos compuestos y partículas, siglas institucionales, et al., 2020a,
   localizadores, citas narrativas, cf./véase, ibid./op. cit., normativa,
   y falsos positivos con años sueltos, topónimos y meses.

const UC = '\\p{Lu}';
const LW = "[\\p{L}'\u2019\\-]";
const NW = `${UC}${LW}*`;
const PART = "(?:de las|de los|de la|del|de|da|das|do|dos|di|della|dello|van der|van den|van|von|le|la|du|des|d'|O'|Mc|Mac|St\\.)";
const PART_SET = new Set(['de','del','da','das','do','dos','di','della','dello','van','von','le','la','du','des',"d'","o'",'mc','mac']);
const SUR_IN = `(?:${PART}\\s+)?${NW}(?:[\\s\\-]+(?:${PART}\\s+)?${NW}){0,3}`;
const SUR_NA = `(?:${PART}\\s+)?${NW}(?:\\s+(?:${PART}\\s+)?${NW}){0,1}`;
const SEP = "(?:\\s*,\\s*|\\s+(?:y|e|and|&)\\s+)";
const ETAL = "(?:\\s*,?\\s*et\\s*al\\.?)?";
const SIGLA = "(?:\\s*\\[[^\\]]{1,60}\\])?";
const YEAR = "(?:\\d{4}\\s*[a-h]?|s\\.\\s?[fd]\\.|s\\/f|n\\.\\s?d\\.|en prensa|in press|no prelo|forthcoming)";
const ORIG = "(?:\\s*\\[\\d{4}[a-z]?\\])?";
const LOCNUM = "(?:\\d+(?:\\s*[-–—]\\s*\\d+)?|[IVXLCivxlc]{1,7}(?![\\p{L}]))";
const LOC = `(?:\\s*[:,]\\s*(?:pp?\\.|p[áa]gs?\\.|cap\\.)?\\s*${LOCNUM})?`;
const AUTHORS_IN = `${SUR_IN}(?:${SEP}${SUR_IN})*${ETAL}`;
const AUTHORS_NA = `${SUR_NA}(?:${SEP}${SUR_NA})*${ETAL}`;
const RE_UNIT = new RegExp(`(${AUTHORS_IN})${SIGLA}\\s*,?\\s*\\(?\\s*(${YEAR})\\s*\\)?${ORIG}${LOC}`, 'giu');
const RE_NARR = new RegExp(`(${AUTHORS_NA})${SIGLA}\\s*\\(\\s*(${YEAR})${ORIG}${LOC}\\s*\\)`, 'gu');
const RE_ANAPH = /\b(ib[ií]d\.?(?:em)?|[ií]dem|op\.\s?cit\.|art\.\s?cit\.|loc\.\s?cit\.)/gi;
const RE_LOOSE = new RegExp(`^(${AUTHORS_IN})\\s*,?\\s*\\(?\\s*(${YEAR})`, 'iu');
const RE_NORMA = new RegExp(
  "\\b(Leis?|Leyes?|Ley|Decreto\\s+de\\s+Necesidad\\s+y\\s+Urgencia|Decreto[-\\s]?Ley|Decretos?|DNU|Resoluç[ãa]o|Resoluci[oó]n(?:es)?|Res\\.|" +
  "Disposici[oó]n|Disp\\.|Acordada|Ordenanza|Portaria|Medida\\s+Provis[óo]ria|Convenio\\s+Colectivo(?:\\s+de\\s+Trabajo)?|CCT|Convenios?|" +
  "Recomendaci[oó]n|Directiva|Reglamento|Laudo|Acta)\\s*(?:N[°ºo]?\\.?\\s*)?(\\d{1,3}(?:\\.\\d{3})+|\\d{1,6})(\\s*\\/\\s*\\d{2,4})?", "gu");
const RE_CUERPO = new RegExp(
  "\\b(C[oó]digo\\s+(?:Civil\\s+y\\s+Comercial|Civil|Penal|Procesal\\s+\\p{L}+|Aeron[aá]utico|de\\s+Comercio|de\\s+Miner[ií]a|Alimentario\\s+Argentino)|" +
  "Consolidaç[ãa]o\\s+das\\s+Leis\\s+do\\s+Trabalho|Constituci[oó]n\\s+(?:Nacional|de\\s+la\\s+Naci[oó]n\\s+Argentina|Provincial)|" +
  "Ley\\s+de\\s+Contrato\\s+de\\s+Trabajo|Ley\\s+de\\s+Riesgos\\s+del\\s+Trabajo|LCT|LRT|CLT)\\b", "gu");

const STOP = new Set(['en','el','la','los','las','un','una','unos','unas','este','esta','estos','estas','ese','esa','esos','esas',
'aquel','aquella','otro','otra','otros','otras','mismo','misma','todo','toda','todos','todas','cada','algunos','algunas','muchos',
'muchas','pocos','varios','varias','sin','con','para','por','como','segun','desde','hasta','entre','durante','mientras','cuando',
'donde','si','no','ya','tambien','ademas','asimismo','embargo','decir','ejemplo','esto','eso','aquello','tanto','tan','mas','menos',
'muy','y','o','pero','aunque','porque','pues','luego','entonces','ahora','hoy','ayer','asi','tal','cual','quien','que','del','al','a',
'ante','bajo','cabe','contra','hacia','mediante','salvo','sobre','tras','versus','via','capitulo','cuadro','grafico','tabla','figura',
'anexo','nota','apartado','seccion','parte','tomo','volumen','ley','leyes','decreto','resolucion','articulo','articulos','inciso',
'argentina','brasil','chile','uruguay','mexico','espana','colombia','peru','bolivia','paraguay','ecuador','venezuela','cuba',
'buenos','aires','cordoba','rosario','america','latina','europa','estados','unidos','reino','unido','francia','italia','alemania',
'enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','setiembre','octubre','noviembre','diciembre',
'estado','gobierno','ministerio','congreso','the','of','in','and','this','that','these','those','however','moreover','while','since',
'after','before','during','also','thus','therefore','nuestro','nuestra','nuestros','nuestras','su','sus','mi','mis','le','les','lo',

const normYear = y => {
  const s = String(y).replace(/\s+/g,'').toLowerCase();
  if (/^\d{4}[a-h]?$/.test(s)) return s;
  if (/^s\.?\/?[fd]\.?$/.test(s) || /^n\.?d\.?$/.test(s)) return 's.f.';
  if (/prensa|press|prelo|forthcoming/.test(s)) return 'en prensa';
  return s;
};
function trimStop(a0){
  let a = String(a0).trim().replace(/\s+/g,' ');
  for (let g = 0; g < 6; g++){
    const m = a.match(new RegExp(`^(${LW}+)\\s+(?=\\p{Lu})`,'u'));
    if (!m) break;
    const tok = deacc(m[1]).toLowerCase();
    if (PART_SET.has(tok)) break;
    if (STOP.has(tok)) a = a.slice(m[0].length); else break;
  }
  const first = deacc(a.split(/\s+/)[0]||'').toLowerCase();
  if (!a || (STOP.has(first) && !PART_SET.has(first))) return '';
  return a;
}
const tidyAuthors = a => String(a).replace(/\s+/g,' ').replace(/\s*,\s*et\s*al\.?/i,' et al.')
  .replace(/\s+et\s*al\.?$/i,' et al.').replace(/\s*&\s*/g,' & ').trim().replace(/[,;]$/,'');
function firstSurname(authors){
  let a = String(authors).replace(/\s+et\s+al\.?/i,'').trim();
  a = a.split(/\s*,\s*|\s+(?:y|e|and|&)\s+/)[0] || a;
  return a.replace(/\s*\[[^\]]*\]\s*/g,'').trim();
}
const mkHit = (para,start,end,authors,year,kind,status) =>
  ({ id:'h'+(S.seq++), para, start, end, authors, year, kind, status });
const fragOf = h => S.paras[h.para] ? S.paras[h.para].text.slice(h.start, h.end) : '';

function detect(paras){
  const hits = []; let last = null;
  paras.forEach((p, pi) => {
    const text = p.text, taken = [];
    const busy = (s,e) => taken.some(r => s < r[1] && e > r[0]);
    const claim = (s,e) => taken.push([s,e]);

    if (CFG.laws){
      let m;
      /* si la norma viene seguida de su sigla —"Ley de Contrato de Trabajo (LCT)"—
         absorbemos el paréntesis para no contarla dos veces */
      const withSigla = end => {
        const tail = text.slice(end).match(/^\s*\(\s*[\p{Lu}]{2,8}\s*\)/u);
        return tail ? end + tail[0].length : end;
      };
      RE_NORMA.lastIndex = 0;
      while ((m = RE_NORMA.exec(text)) !== null){
        const h = mkHit(pi, m.index, withSigla(m.index+m[0].length),
          m[0].replace(/\s+/g,' ').replace(/\s*\/\s*/,'/').trim(), '', 'ley', 'ok');
        hits.push(h); claim(h.start, h.end);
      }
      RE_CUERPO.lastIndex = 0;
      while ((m = RE_CUERPO.exec(text)) !== null){
        if (busy(m.index, m.index+m[0].length)) continue;
        const h = mkHit(pi, m.index, withSigla(m.index+m[0].length), m[0].replace(/\s+/g,' ').trim(), '', 'ley', 'ok');
        hits.push(h); claim(h.start, h.end);
      }
    }

    const reParen = /\(([^()]{2,500})\)/g;
    let pm;
    while ((pm = reParen.exec(text)) !== null){
      const inner = pm[1], base = pm.index + 1, covered = [];
      RE_UNIT.lastIndex = 0;
      let u;
      while ((u = RE_UNIT.exec(inner)) !== null){
        const authors = tidyAuthors(trimStop(u[1]));
        const firstTok = (authors.split(' ')[0] || u[1].trim().split(' ')[0]);
        const shift = u[0].indexOf(firstTok);
        const st = base + u.index + (shift > 0 ? shift : 0);
        const en = base + u.index + u[0].length;
        covered.push([u.index, u.index + u[0].length]);
        if (!authors || authors.length < 2 || busy(st,en)) continue;
        const h = mkHit(pi, st, en, authors, normYear(u[2]), 'paren', 'ok');
        hits.push(h); claim(st,en); last = h;
      }
      let cursor = 0; const left = [];
      covered.sort((a,b) => a[0]-b[0]).forEach(([a,b]) => { if (a > cursor) left.push([cursor,a]); cursor = Math.max(cursor,b); });
      if (cursor < inner.length) left.push([cursor, inner.length]);
      left.forEach(([a,b]) => {
        const seg = inner.slice(a,b);
        if (!/\d{4}/.test(seg) || !new RegExp(UC,'u').test(seg) || seg.length > 110) return;
        if (/^\s*[,;.\s]*$/.test(seg)) return;
        if (/^[\s,;]*(?:tabla|cuadro|gr[áa]fico|figura|anexo|art)/i.test(seg)) return;
        const ym = seg.match(/\b(\d{4}[a-h]?)\b/);
        const am = trimStop(seg.replace(/\b\d{4}[a-h]?\b[\s\S]*$/,'').replace(/[,;:]\s*$/,'').trim());
        if (!ym || !am || am.length < 3) return;
        const st = base + a + (seg.length - seg.replace(/^[\s,;]+/,'').length), en = base + b;
        if (busy(st,en)) return;
        const h = mkHit(pi, st, en, tidyAuthors(am), normYear(ym[1]), 'paren', 'sug');
        hits.push(h); claim(st,en);
      });
    }

    RE_NARR.lastIndex = 0;
    let nm;
    while ((nm = RE_NARR.exec(text)) !== null){
      const st0 = nm.index, en0 = nm.index + nm[0].length;
      if (busy(st0,en0)) continue;
      const cleaned = trimStop(nm[1]); if (!cleaned) continue;
      const shift = nm[0].indexOf(cleaned);
      const st = st0 + (shift > 0 ? shift : 0);
      const h = mkHit(pi, st, en0, tidyAuthors(cleaned), normYear(nm[2]), 'narr', 'ok');
      hits.push(h); claim(st,en0); last = h;
    }

    RE_ANAPH.lastIndex = 0;
    let am2;
    while ((am2 = RE_ANAPH.exec(text)) !== null){
      const st = am2.index, en = st + am2[0].length;
      if (busy(st,en) || !last) continue;
      const h = mkHit(pi, st, en, last.authors, last.year, 'anaf', 'ok');
      hits.push(h); claim(st,en);
    }
  });
  hits.sort((a,b) => a.para - b.para || a.start - b.start);
  return hits;
}

function groupWorks(hits){
  const map = new Map();
  hits.filter(h => h.status === 'ok' && h.kind !== 'ley').forEach(h => {
    const key = slug(h.authors) + '|' + slug(h.year);
    if (!map.has(key)) map.set(key, { key, authors:h.authors, year:h.year,
      surname:firstSurname(h.authors), hits:[], bib:null, dup:false, merged:false });
    map.get(key).hits.push(h);
  });
  let list = [...map.values()];
  if (CFG.mergeEtal){
    const byFirst = new Map();
    list.forEach(w => { const k = slug(w.surname)+'|'+slug(w.year);
      if (!byFirst.has(k)) byFirst.set(k,[]); byFirst.get(k).push(w); });
    const out = [];
    byFirst.forEach(g => {
      if (g.length === 1){ out.push(g[0]); return; }
      const etal = g.filter(w => /et al\./i.test(w.authors)), full = g.filter(w => !/et al\./i.test(w.authors));
      if (etal.length && full.length === 1){
        const target = full[0];
        etal.forEach(e => e.hits.forEach(h => target.hits.push(h)));
        target.merged = true; out.push(target);
      } else g.forEach(w => { w.dup = true; out.push(w); });
    });
    list = out;
  }
  list.forEach(w => {
    w.hits.sort((a,b) => a.para - b.para || a.start - b.start);
    w.manual = S.refOverride.get(w.key) || null;
  });
  list.sort((a,b) => slug(a.surname).localeCompare(slug(b.surname)) || String(a.year).localeCompare(String(b.year)));
  return list;
}
function groupNorms(hits){
  const map = new Map();
  hits.filter(h => h.kind === 'ley').forEach(h => {
    const key = slug(h.authors);
    if (!map.has(key)) map.set(key, { key, label:h.authors, hits:[] });
    map.get(key).hits.push(h);
  });
  const list = [...map.values()];
  list.forEach(n => n.manual = S.normOverride.get(n.key) || null);
  list.sort((a,b) => a.label.localeCompare(b.label,'es',{numeric:true}));
  return list;
}

const LATEX = [
  [/\\'\{?a\}?/g,'á'],[/\\'\{?e\}?/g,'é'],[/\\'\{?i\}?/g,'í'],[/\\'\{?o\}?/g,'ó'],[/\\'\{?u\}?/g,'ú'],
  [/\\'\{?A\}?/g,'Á'],[/\\'\{?E\}?/g,'É'],[/\\'\{?I\}?/g,'Í'],[/\\'\{?O\}?/g,'Ó'],[/\\'\{?U\}?/g,'Ú'],
  [/\\~\{?n\}?/g,'ñ'],[/\\~\{?N\}?/g,'Ñ'],[/\\~\{?a\}?/g,'ã'],[/\\~\{?o\}?/g,'õ'],
  [/\\"\{?u\}?/g,'ü'],[/\\"\{?U\}?/g,'Ü'],[/\\`\{?a\}?/g,'à'],[/\\`\{?e\}?/g,'è'],
  [/\\\^\{?e\}?/g,'ê'],[/\\\^\{?a\}?/g,'â'],[/\\\^\{?o\}?/g,'ô'],[/\\c\{?c\}?/g,'ç'],
  [/\\&/g,'&'],[/\\%/g,'%'],[/\\_/g,'_'],[/\\\$/g,'$'],[/\\#/g,'#'],
  [/\\emph\{([^}]*)\}/g,'$1'],[/\\textit\{([^}]*)\}/g,'$1'],[/--/g,'–']
];
const delatex = s => { let x = String(s); LATEX.forEach(([r,v]) => x = x.replace(r,v));
  return x.replace(/[{}]/g,'').replace(/\s+/g,' ').trim(); };

function parseBib(src){
  const entries = []; let i = 0;
  while (i < src.length){
    const at = src.indexOf('@', i); if (at === -1) break;
    const ob = src.indexOf('{', at); if (ob === -1) break;
    const type = src.slice(at+1, ob).trim().toLowerCase();
    if (['comment','string','preamble'].includes(type)){ i = ob+1; continue; }
    let d = 0, end = -1;
    for (let j = ob; j < src.length; j++){ if (src[j]==='{') d++; else if (src[j]==='}'){ d--; if (!d){ end=j; break; } } }
    if (end === -1) break;
    const body = src.slice(ob+1, end); i = end+1;
    const comma = body.indexOf(',');
    const e = { type, citekey:(comma===-1?body:body.slice(0,comma)).trim(), fields:{} };
    const raw = comma === -1 ? '' : body.slice(comma+1);
    let k = 0;
    while (k < raw.length){
      const eq = raw.indexOf('=', k); if (eq === -1) break;
      const name = raw.slice(k, eq).replace(/^[\s,]+/,'').trim().toLowerCase();
      let p = eq+1; while (p < raw.length && /\s/.test(raw[p])) p++;
      let val = '';
      if (raw[p] === '{'){ let dd=0,q=p; for (; q<raw.length; q++){ if(raw[q]==='{')dd++; else if(raw[q]==='}'){dd--; if(!dd)break;} }
        val = raw.slice(p+1,q); p = q+1; }
      else if (raw[p] === '"'){ let q=p+1; while (q<raw.length && !(raw[q]==='"' && raw[q-1]!=='\\')) q++;
        val = raw.slice(p+1,q); p = q+1; }
      else { let q=p; while (q<raw.length && raw[q] !== ',' && raw[q] !== '\n') q++; val = raw.slice(p,q); p = q; }
      if (name) e.fields[name] = delatex(val);
      const nc = raw.indexOf(',', p); k = nc === -1 ? raw.length : nc+1;
    }
    if (Object.keys(e.fields).length) entries.push(e);
  }
  entries.forEach(e => {
    e.authors = splitAuthors(e.fields.author || '');
    e.editors = splitAuthors(e.fields.editor || '');
    const y = String(e.fields.year || e.fields.date || '').match(/\d{4}/);
    e.year = y ? y[0] : '';
  });
  return entries;
}
function splitAuthors(raw){
  if (!raw) return [];
  return raw.split(/\s+and\s+/i).map(a => {
    a = a.trim(); if (!a) return null;
    if (a.includes(',')){ const [l,f] = a.split(','); return { last:l.trim(), first:(f||'').trim() }; }
    const tk = a.split(/\s+/);
    if (tk.length === 1) return { last:tk[0], first:'' };
    let idx = tk.findIndex((x,i) => i>0 && /^[a-záéíóúñüãõç']/.test(x));
    if (idx === -1) idx = tk.length-1;
    return { last:tk.slice(idx).join(' '), first:tk.slice(0,idx).join(' ') };
  }).filter(Boolean);
}
function buildBibIndex(entries){
  const idx = new Map();
  const push = (k,e) => { if(!k) return; if(!idx.has(k)) idx.set(k,[]); idx.get(k).push(e); };
  entries.forEach(e => {
    const ppl = e.authors.length ? e.authors : e.editors;
    if (!ppl.length) return;
    push(slug(ppl[0].last)+'|'+e.year, e);
    ppl.slice(1).forEach(p => push('any:'+slug(p.last)+'|'+e.year, e));
  });
  return idx;
}
/* perfil disciplinar implícito en tu propia bibliografía */
function indexBibProfile(){
  S.bibVenues = new Set(); S.bibSurnames = new Set();
  S.bib.forEach(e => {
    [e.fields.journal, e.fields.journaltitle, e.fields.booktitle, e.fields.publisher]
      .filter(Boolean).forEach(v => { if (slug(v).length > 4) S.bibVenues.add(slug(v)); });
    (e.authors||[]).concat(e.editors||[]).forEach(p => S.bibSurnames.add(slug(p.last)));
  });
}
function matchWork(w){
  if (!S.bibIndex.size) return null;
  const sur = slug(w.surname), yF = String(w.year), yN = yF.replace(/[a-h]$/,'');
  const c = S.bibIndex.get(sur+'|'+yF) || S.bibIndex.get(sur+'|'+yN) || S.bibIndex.get('any:'+sur+'|'+yN);
  return (c && c.length) ? { entry:c[0], ambiguous:c.length>1, alts:c } : null;
}

   VOCABULARIO DEL DOCUMENTO Y PALABRAS DE CONTEXTO
   ========================================================================= */
const tokenize = s => deacc(String(s)).toLowerCase().replace(/[^a-z0-9áéíóúñü\s]/g,' ')
  .split(/\s+/).filter(w => w.length >= 5 && !STOP.has(w) && !/^\d+$/.test(w));

function buildVocab(){
  const f = new Map();
  S.paras.forEach(p => tokenize(p.text).forEach(w => f.set(w, (f.get(w)||0)+1)));
  /* nos quedamos con los términos frecuentes: son el campo semántico de la tesis */
  S.vocab = new Map([...f.entries()].filter(([,n]) => n >= 3).sort((a,b) => b[1]-a[1]).slice(0, 400));
}
/* términos que rodean a esta cita en particular */
function ctxWords(w, n = 5){
  if (!CFG.useCtx) return [];
  const bag = new Map();
  const own = new Set(slug(w.authors).match(/[a-z]+/g) || []);
  w.hits.slice(0, 4).forEach(h => {
    const txt = S.paras[h.para] ? S.paras[h.para].text : '';
    const seg = txt.slice(Math.max(0, h.start-240), Math.min(txt.length, h.end+240));
    tokenize(seg).forEach(t2 => {
      if (own.has(t2)) return;
      bag.set(t2, (bag.get(t2)||0) + 1 + (S.vocab.has(t2) ? 1 : 0));
    });
  });
  return [...bag.entries()].sort((a,b) => b[1]-a[1]).slice(0, n).map(x => x[0]);
}

/* =========================================================================
   FORMATOS DE REFERENCIA
   ========================================================================= */
const initials = f => !f ? '' : f.split(/[\s.]+/).filter(Boolean).map(x => x[0].toUpperCase()+'.').join(' ');
function joinNames(names, conj){
  if (!names.length) return '';
  if (names.length === 1) return names[0];
  if (names.length > 20) return names.slice(0,19).join(', ')+', … '+names[names.length-1];
  return names.slice(0,-1).join(', ')+` ${conj} `+names[names.length-1];
}
const apaNames = (ppl,c) => joinNames(ppl.map(p => initials(p.first) ? `${p.last}, ${initials(p.first)}` : p.last), c);
const fullNames = (ppl,c) => joinNames(ppl.map((p,i) => i===0
  ? (p.first ? `${p.last}, ${p.first}` : p.last) : (p.first ? `${p.first} ${p.last}` : p.last)), c);

function formatRef(entry, year, style, lang){
  const L = REFL[lang] || REFL.es, c = L.conj;
  const f = entry.fields || {}, ty = entry.type;
  const Y = year || entry.year || L.nd;
  const T = f.title || '—';
  const em = s => `<em>${esc(s)}</em>`;
  const pages = f.pages ? f.pages.replace(/--/g,'–') : '';
  const jour = f.journal || f.journaltitle || '';
  const book = f.booktitle || '';
  const pub = f.publisher || f.institution || f.organization || f.school || '';
  const doi = f.doi ? (String(f.doi).startsWith('http') ? f.doi : 'https://doi.org/'+f.doi) : (f.url || '');
  const ppl = entry.authors && entry.authors.length ? entry.authors : (entry.editors||[]);
  let out;

  if (style === 'mla9'){
    const A = fullNames(ppl, c);
    if (ty==='article') out = `${esc(A)}. "${esc(T)}." ${jour?em(jour):''}${f.volume?`, vol. ${esc(f.volume)}`:''}${f.number?`, no. ${esc(f.number)}`:''}, ${esc(Y)}${pages?`, ${L.pp} ${esc(pages)}`:''}.`;
    else if (ty==='incollection'||ty==='inbook') out = `${esc(A)}. "${esc(T)}." ${book?em(book):''}, ${esc(pub)}, ${esc(Y)}${pages?`, ${L.pp} ${esc(pages)}`:''}.`;
    else out = `${esc(A)}. ${em(T)}. ${esc(pub)}, ${esc(Y)}.`;
    if (doi) out += ` ${esc(doi)}.`;
  } else if (style === 'chicago'){
    const A = fullNames(ppl, c);
    if (ty==='article') out = `${esc(A)}. ${esc(Y)}. "${esc(T)}." ${jour?em(jour):''}${f.volume?` ${esc(f.volume)}`:''}${f.number?` (${esc(f.number)})`:''}${pages?`: ${esc(pages)}`:''}.`;
    else if (ty==='incollection'||ty==='inbook') out = `${esc(A)}. ${esc(Y)}. "${esc(T)}." ${L.in} ${book?em(book):''}${pages?`, ${esc(pages)}`:''}. ${esc(pub)}.`;
    else out = `${esc(A)}. ${esc(Y)}. ${em(T)}. ${esc(pub)}.`;
    if (doi) out += ` ${esc(doi)}.`;
  } else {
    const A = apaNames(ppl, c);
    const link = doi ? ` ${esc(doi)}` : '';
    if (ty==='article'||ty==='periodical'){
      out = `${esc(A)} (${esc(Y)}). ${esc(T)}. ${jour?em(jour):''}${f.volume?', '+em(f.volume):''}${f.number?`(${esc(f.number)})`:''}${pages?`, ${esc(pages)}`:''}.${link}`;
    } else if (ty==='incollection'||ty==='inbook'||ty==='chapter'){
      const eds = (entry.editors||[]).length
        ? `${joinNames((entry.editors).map(p => initials(p.first)?`${initials(p.first)} ${p.last}`:p.last), c)} (${entry.editors.length>1?L.eds:L.ed}), ` : '';
      out = `${esc(A)} (${esc(Y)}). ${esc(T)}. ${L.in} ${esc(eds)}${book?em(book):''}${pages?` (${L.pp} ${esc(pages)})`:''}. ${esc(pub)}.${link}`;
    } else if (ty==='inproceedings'||ty==='conference'){
      out = `${esc(A)} (${esc(Y)}). ${esc(T)} [${L.paper}]. ${book?em(book):''}${pub?'. '+esc(pub):''}.${link}`;
    } else if (ty==='phdthesis'||ty==='mastersthesis'||ty==='thesis'){
      const kind = ty==='phdthesis'?L.phd:(ty==='mastersthesis'?L.ms:(f.type||L.thesis));
      out = `${esc(A)} (${esc(Y)}). ${em(T)} [${esc(kind)}, ${esc(f.school||f.institution||'s/i')}].${link}`;
    } else if (ty==='techreport'||ty==='report'){
      out = `${esc(A)} (${esc(Y)}). ${em(T)}${f.number?` (${esc(f.number)})`:''}. ${esc(pub)}.${link}`;
    } else if (ty==='online'||ty==='misc'||ty==='electronic'){
      out = `${esc(A)} (${esc(Y)}). ${em(T)}.${(f.howpublished||pub)?' '+esc(f.howpublished||pub)+'.':''}${link}`;
    } else {
      out = `${esc(A)} (${esc(Y)}). ${em(T)}${f.edition?` (${esc(f.edition)} ${L.edn})`:''}. ${esc(pub)}.${link}`;
    }
  }
  return out.replace(/\s+\./g,'.').replace(/\.{2,}/g,'.').replace(/\s{2,}/g,' ').replace(/,\s*\./g,'.').trim();
}
const fmt = (entry, year) => formatRef(entry, year, CFG.style, CFG.refLang);
function normTemplate(label, style, lang){
  const L = lang || CFG.refLang;
  if (L === 'en') return `${label} of [year]. [Title of the statute]. [Date]. [Official gazette].`;
  if (L === 'pt') return `${label} de [ano]. [Título da norma]. [Data]. [Diário Oficial].`;
  return `${label} de [año]. [Título de la norma]. [Fecha de sanción]. Boletín Oficial [N°].`;
}

/* =========================================================================
   FUENTES (libres, sin clave, opcionales)
   ========================================================================= */
const mkEntry = (type, authors, year, fields, src, lang) =>
  ({ type, authors, editors:[], year:String(year||''), fields, _src:src, _lang:lang||'' });
const splitDisplay = name => {
  const tk = String(name).trim().split(/\s+/);
  return tk.length === 1 ? { last:tk[0], first:'' } : { last:tk[tk.length-1], first:tk.slice(0,-1).join(' ') };
};
const jget = async u => { const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.json(); };

const CR_TYPE = {'journal-article':'article','book':'book','book-chapter':'incollection','proceedings-article':'inproceedings','report':'techreport','dissertation':'phdthesis'};
const OA_TYPE = {'article':'article','book-chapter':'incollection','book':'book','dissertation':'phdthesis','report':'techreport'};

const crossrefItem = it => mkEntry(CR_TYPE[it.type]||'misc',
  (it.author||[]).map(a => ({last:a.family||a.name||'', first:a.given||''})).filter(a=>a.last),
  it.issued?.['date-parts']?.[0]?.[0] || '',
  { title:[].concat(it.title||[])[0]||'', journal:[].concat(it['container-title']||[])[0]||'',
    booktitle:[].concat(it['container-title']||[])[0]||'', volume:it.volume||'', number:it.issue||'',
    pages:it.page||'', publisher:it.publisher||'', doi:it.DOI||'' }, 'Crossref', (it.language||'').slice(0,2));

const openalexItem = it => {
  const loc = it.primary_location?.source?.display_name || '';
  return mkEntry(OA_TYPE[it.type]||'misc',
    (it.authorships||[]).map(a => splitDisplay(a.author?.display_name || a.raw_author_name || '')).filter(a=>a.last),
    it.publication_year||'',
    { title:it.title||it.display_name||'', journal:loc, booktitle:loc,
      volume:it.biblio?.volume||'', number:it.biblio?.issue||'',
      pages:[it.biblio?.first_page,it.biblio?.last_page].filter(Boolean).join('–'),
      publisher:it.primary_location?.source?.host_organization_name||'',
      doi:(it.doi||'').replace('https://doi.org/','') }, 'OpenAlex', it.language||'');
};

/* recupera una referencia a partir de un DOI, un ISBN o una URL pegada */
async function resolveIdent(raw){
  const s0 = String(raw||'').trim(); if (!s0) return null;
  const doi = (s0.match(/10\.\d{4,9}\/[^\s"'<>]+/)||[])[0];
  if (doi){
    const clean = doi.replace(/[.,;)\]]+$/,'');
    try { const j = await jget('https://api.crossref.org/works/'+encodeURIComponent(clean));
      if (j.message) return { entry:crossrefItem(j.message), link:'https://doi.org/'+clean }; } catch(e){}
    try { const j = await jget('https://api.openalex.org/works/doi:'+encodeURIComponent(clean));
      if (j && (j.title||j.display_name)) return { entry:openalexItem(j), link:'https://doi.org/'+clean }; } catch(e){}
    return { entry:null, link:'https://doi.org/'+clean };
  }
  if (!/^https?:\/\//.test(s0)){
    const isbn = (s0.replace(/[-\s]/g,'').match(/\b(?:97[89])?\d{9}[\dXx]\b/)||[])[0];
    if (isbn){
      try {
        const j = await jget(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
        const d = j['ISBN:'+isbn];
        if (d) return { entry: mkEntry('book',
          (d.authors||[]).map(a => splitDisplay(a.name||'')).filter(a=>a.last),
          (String(d.publish_date||'').match(/\d{4}/)||[''])[0],
          { title:d.title||'', publisher:(d.publishers||[])[0]?.name||'' }, 'Open Library'),
          link: d.url||'' };
      } catch(e){}
    }
    return null;
  }
  return { entry:null, link:s0 };
}

async function qCrossref(sur, year, kw){
  const u = `https://api.crossref.org/works?query.author=${encodeURIComponent(sur)}`
    + (kw.length ? `&query.bibliographic=${encodeURIComponent(kw.join(' '))}` : '')
    + (/^\d{4}$/.test(year) ? `&filter=from-pub-date:${year}-01-01,until-pub-date:${year}-12-31` : '')
    + `&rows=6&select=title,author,issued,container-title,volume,issue,page,publisher,DOI,type,language`;
  const j = await jget(u);
  return (j.message?.items||[]).map(crossrefItem);
}
async function qOpenAlex(sur, year, kw){
  const build = withArea => {
    const f = [`raw_author_name.search:${sur}`];
    if (/^\d{4}$/.test(year)) f.push(`publication_year:${year}`);
    if (withArea && AREAS[CFG.area] && AREAS[CFG.area].length)
      f.push('primary_topic.field.id:' + AREAS[CFG.area].map(n => 'fields/'+n).join('|'));
    if (CFG.pubLang) f.push('language:' + CFG.pubLang);
    return `https://api.openalex.org/works?filter=${encodeURIComponent(f.join(','))}&per-page=6`;
  };
  let j;
  try { j = await jget(build(true)); }
  catch(e){ j = await jget(build(false)); }        // si el filtro de área falla, buscamos sin él
  if (!(j.results||[]).length && (AREAS[CFG.area]||[]).length) { try { j = await jget(build(false)); } catch(e){} }
  return (j.results||[]).map(openalexItem);
}
async function qDoaj(sur, year, kw){
  let q = `bibjson.author.name:"${sur}"` + (/^\d{4}$/.test(year) ? ` AND bibjson.year:${year}` : '');
  const j = await jget(`https://doaj.org/api/search/articles/${encodeURIComponent(q)}?pageSize=6`);
  return (j.results||[]).map(r => {
    const b = r.bibjson||{}, doi = (b.identifier||[]).find(i => i.type==='doi');
    return mkEntry('article', (b.author||[]).map(a => splitDisplay(a.name||'')).filter(a=>a.last), b.year||'',
      { title:b.title||'', journal:b.journal?.title||'', volume:b.journal?.volume||'', number:b.journal?.number||'',
        pages:[b.start_page,b.end_page].filter(Boolean).join('–'), publisher:b.journal?.publisher||'',
        doi:doi?doi.id:'' }, 'DOAJ', (b.journal?.language||[])[0]||'');
  });
}
async function qOpenLibrary(sur, year, kw){
  const q = `author:"${sur}"` + (/^\d{4}$/.test(year) ? ` first_publish_year:${year}` : '')
          + (kw.length ? ' ' + kw.slice(0,2).join(' ') : '');
  const j = await jget(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=6&fields=title,author_name,first_publish_year,publisher,language`);
  return (j.docs||[]).map(d => mkEntry('book', (d.author_name||[]).map(splitDisplay), d.first_publish_year||'',
    { title:d.title||'', publisher:(d.publisher||[])[0]||'' }, 'Open Library',
    ({spa:'es',eng:'en',por:'pt'})[(d.language||[])[0]] || ''));
}
const QFN = { crossref:qCrossref, openalex:qOpenAlex, doaj:qDoaj, openlibrary:qOpenLibrary };

/* puntuar en vez de filtrar: si el orden se equivoca, la buena sigue estando */
function scoreCand(e, w, kw){
  const target = slug(w.surname), yN = String(w.year).replace(/[a-h]$/,'');
  let s = 0;
  if (String(e.year) === yN) s += 4; else if (Math.abs(+e.year - +yN) === 1) s += 1;
  if (slug((e.authors[0]||{}).last||'') === target) s += 4;
  else if (e.authors.some(a => slug(a.last) === target)) s += 2;
  const venue = slug(e.fields.journal || e.fields.booktitle || '');
  if (venue && S.bibVenues.has(venue)) s += 2.5;
  if (slug(e.fields.publisher||'') && S.bibVenues.has(slug(e.fields.publisher))) s += 1.5;
  let co = 0;
  e.authors.forEach(a => { if (slug(a.last) !== target && S.bibSurnames.has(slug(a.last))) co++; });
  s += Math.min(co, 2) * 1.2;
  const tt = new Set(tokenize(e.fields.title || ''));
  let voc = 0, ctx = 0;
  tt.forEach(x => { if (S.vocab.has(x)) voc++; if (kw.includes(x)) ctx++; });
  s += Math.min(voc, 4) * 0.7 + Math.min(ctx, 3) * 1.3;
  if (e._lang && CFG.pubLang && e._lang === CFG.pubLang) s += 1;
  else if (e._lang && !CFG.pubLang && e._lang === CFG.refLang) s += 0.5;
  if (e.fields.doi) s += 0.5;
  if (!e.fields.title) s -= 5;
  return s;
}
async function lookup(w){
  const sur = w.surname, year = String(w.year).replace(/[a-h]$/,'');
  const kw = ctxWords(w);
  const active = Object.keys(CFG.sources).filter(k => CFG.sources[k]);
  const res = await Promise.allSettled(active.map(k => QFN[k](sur, year, kw)));
  const seen = new Set(), out = [];
  res.forEach(r => { if (r.status !== 'fulfilled') return;
    r.value.forEach(e => {
      const k = e.fields.doi ? slug(e.fields.doi) : slug(e.fields.title)+e.year;
      if (!k || seen.has(k)) return; seen.add(k); out.push(e);
    });
  });
  out.forEach(e => e._score = scoreCand(e, w, kw));
  out.sort((a,b) => b._score - a._score);
  return out.filter(e => e._score > 0).slice(0, 8);
}

function renderDoc(){
  const doc = $('doc');
  if (!S.paras.length){ doc.innerHTML=''; return; }
  $('empty').classList.add('hidden');
  const byPara = new Map();
  S.hits.forEach(h => { if(!byPara.has(h.para)) byPara.set(h.para,[]); byPara.get(h.para).push(h); });
  const resolved = new Set();
  S.works.forEach(w => { if (refOf(w)) w.hits.forEach(h => resolved.add(h.id)); });
  doc.innerHTML = S.paras.map((p,i) => {
    const marks = (byPara.get(i)||[]).slice().sort((a,b)=>a.start-b.start);
    let out='', cur=0;
    marks.forEach(h => {
      if (h.start < cur) return;
      out += esc(p.text.slice(cur, h.start));
      const cls = ['cit'];
      if (h.kind === 'ley') cls.push('is-ley');
      else if (h.status === 'sug') cls.push('is-sug');
      else if (resolved.has(h.id)) cls.push('is-done');
      out += `<mark class="${cls.join(' ')}" data-hit="${h.id}">${esc(p.text.slice(h.start,h.end))}</mark>`;
      cur = h.end;
    });
    out += esc(p.text.slice(cur));
    return `<${p.tag||'p'} data-p="${i}">${out||'&nbsp;'}</${p.tag||'p'}>`;
  }).join('');
  requestAnimationFrame(drawRuler);
}
function drawRuler(){
  const ruler = $('ruler');
  [...ruler.querySelectorAll('.tick')].forEach(x => x.remove());
  const total = $('scroller').scrollHeight; if (!total) return;
  const H = ruler.clientHeight;
  document.querySelectorAll('mark.cit').forEach(m => {
    const top = m.offsetTop + (m.offsetParent ? m.offsetParent.offsetTop : 0);
    const el = document.createElement('div');
    el.className = 'tick' + (m.classList.contains('is-ley') ? ' is-ley'
      : m.classList.contains('is-sug') ? ' is-sug'
      : m.classList.contains('is-done') ? ' is-done' : (S.bib.length ? ' is-open' : ''));
    el.style.top = (Math.round((top/total)*(H-12))+6)+'px';
    el.title = m.textContent;
    el.onclick = () => jumpTo(m.dataset.hit);
    ruler.appendChild(el);
  });
}
function jumpTo(id, hidePanel = true){
  const el = document.querySelector(`mark[data-hit="${id}"]`); if (!el) return;
  el.scrollIntoView({behavior:'smooth', block:'center'});
  document.querySelectorAll('mark.is-active').forEach(m => m.classList.remove('is-active'));
  el.classList.add('is-active'); setTimeout(() => el.classList.remove('is-active'), 2400);
  if (hidePanel && window.innerWidth <= 900) $('panel').classList.add('is-hidden');
}
/* el ojo recorre las apariciones una tras otra, no siempre la primera */
function cycleTo(key, hits){
  if (!hits || !hits.length) return;
  const i = (S.cycle.get(key) || 0) % hits.length;
  jumpTo(hits[i].id);
  S.cycle.set(key, i + 1);
  if (hits.length > 1) toast(t('occ_n', i+1, hits.length));
}
/* enlace a la publicación, si lo hay */
function linkOf(w){
  const saved = S.link.get(w.key);
  if (saved) return saved;
  if (w.bib){
    const f = w.bib.fields || {};
    if (f.doi) return String(f.doi).startsWith('http') ? f.doi : 'https://doi.org/'+f.doi;
    if (f.url && /^https?:/.test(f.url)) return f.url;
  }
  const m = stripTags(refOf(w) || '').match(/https?:\/\/[^\s<>"')]+/);
  return m ? m[0] : null;
}
const entryLink = e => {
  const f = e.fields || {};
  if (f.doi) return String(f.doi).startsWith('http') ? f.doi : 'https://doi.org/'+f.doi;
  return (f.url && /^https?:/.test(f.url)) ? f.url : '';
};

function recount(){
  S.works = groupWorks(S.hits);

    if (w.manual){ w.bib = (matchWork(w)||{}).entry || null; return; }

    w.bib = m ? m.entry : null; w.ambiguous = m ? m.ambiguous : false; w.alts = m ? m.alts : null;

    `<div class="count"><b>${S.hits.filter(h=>h.status==='ok'&&h.kind!=='ley').length}</b><span>${t('c_mentions')}</span></div>` +

}

/* ------------------------------------------------------------ pestaña LISTA */
function renderList(){
  const body = $('panelBody'), foot = $('panelFoot');
  const q = slug($('qList').value);
  const hit = s => !q || slug(s).includes(q);
  if (!S.hits.length){
    body.innerHTML = `<p class="blank">${esc(t('f_none_p'))}</p>`; foot.innerHTML=''; return;
  }
  const sugs = S.hits.filter(h => h.status==='sug' && hit(h.authors+h.year+fragOf(h)));
  const works = S.works.filter(w => hit(w.authors+w.year));
  const norms = S.norms.filter(n => hit(n.label));
  let html = '';

  if (sugs.length){

        <div class="ffrag">“${esc(fragOf(h))}”</div></div>`;

  html += `<div class="section-head${sugs.length?' gap':''}"><span>${esc(t('sec_works'))}</span><span>${works.length}</span></div>`;
  if (!works.length) html += `<p class="blank">—</p>`;
  works.forEach(w => {
    const h0 = w.hits[0], frag = fragOf(h0);
    /* el fragmento solo aporta cuando difiere de la cita interpretada */
    const shows = slug(frag) !== slug(w.authors + w.year);
    html += `<div class="ficha ${refOf(w)?'is-done':(S.bib.length?'is-open':'')}"><div class="fr">
      <span class="fk">${esc(w.authors)}, ${esc(w.year)}</span>
      <span class="fn">${w.hits.length}×</span>
      <span class="fa">
        ${iconBtn('data-cycle', w.key, {i:'eye', k:'a_view'})}
        ${iconBtn('data-editfrag', h0.id, {i:'pencil', k:'a_edit'})}
        ${iconBtn('data-killwork', w.key, {i:'trash', k:'a_remove'}, 'i-drop')}
      </span></div>
      ${shows ? `<div class="ffrag">“${esc(frag)}”</div>` : ''}
      ${w.merged ? `<div class="fnote">${esc(t('merged'))}</div>` : ''}
      ${w.dup ? `<div class="fwarn">${esc(t('dup'))}</div>` : ''}</div>`;
  });

  if (S.norms.length){
    html += `<div class="section-head gap"><span>${esc(t('sec_norms'))}</span><span>${norms.length}</span></div>`;
    norms.forEach(n => {
      html += `<div class="ficha is-ley"><div class="fr">
        <span class="fk">${esc(n.label)}</span><span class="fn">${n.hits.length}×</span>
        <span class="fa">

  foot.innerHTML = `<button class="btn btn--key" id="copyList">${ICON.copy}${esc(t('copy_list'))}</button>`;
  $('copyList').onclick = () => copyText(S.works.map(w => `${w.authors}, ${w.year}`).join('\n'),
    t('copied_n', S.works.length));
  bindCommon(body);
}

/* ----------------------------------------------------------- pestaña BUSCAR */
function findQueue(){ return S.works; }
function renderFind(){
  const body = $('panelBody'), foot = $('panelFoot'), sub = $('subFind');
  const q = findQueue();
  foot.innerHTML = '';
  if (!q.length){
    sub.innerHTML = `<div class="nav"><div class="who"><b>${esc(t('f_none_h'))}</b></div></div>`;
    body.innerHTML = `<p class="blank">${esc(t('f_none_p'))}</p>`; return;
  }
  if (S.findI >= q.length) S.findI = q.length - 1;
  if (S.findI < 0) S.findI = 0;
  const w = q[S.findI];

  /* el manuscrito de la izquierda salta a la aparición correspondiente */
  if (S.lastJumped !== w.key){
    S.occ.set(w.key, 0); S.lastJumped = w.key;
    setTimeout(() => jumpTo(w.hits[0].id, false), 30);
  }
  paintNav(w, q);

  const cands = S.cands.get(w.key);
  const cur = refOf(w);
  let html = '';

  /* ingreso manual: botón que se despliega en campos, sin modal */
  if (S.manualKey === w.key){
    html += `<div class="manual">
      <label>${esc(t('m_ident'))}</label>
      <div class="manual-row">
        <input type="text" id="manId" placeholder="10.1234/abcd · https://… · 9789871234567">
        <button class="btn btn--mini" id="manFetch">${esc(t('m_fetch'))}</button>
      </div>
      <label>${esc(t('m_ref'))}</label>
      <textarea id="manBox" placeholder="${esc(t('f_manual_ph'))}">${esc(cur?stripTags(cur):'')}</textarea>
      <div class="manual-acts">
        <button class="btn btn--mini btn--ghost" id="manCancel">${esc(t('cancel'))}</button>
        <button class="btn btn--mini btn--key" id="manSave">${esc(t('f_save_next'))}</button>
      </div></div>`;
  } else {
    html += `<button class="btn btn--ghost manual-open" id="manOpen">${ICON.pencil}${esc(t('m_open'))}</button>`;
  }

  html += `<div class="section-head"><span>${esc(t('f_options'))}</span><span></span></div>`;

  /* opción 1: lo que ya está en tu .bib */
  if (w.bib){
    const picked = !w.manual;
    html += `<div class="opt is-bib ${picked?'is-picked':''}">
      <div class="opt-tag"><span class="ok">${esc(t('f_bib_opt'))}</span>${picked?`<span class="k">${esc(t('f_used'))}</span>`:''}</div>
      <div class="opt-ref">${fmt(w.bib, w.year)}</div>
      ${!picked ? `<div style="margin-top:8px"><button class="btn btn--mini btn--keep" id="useBib">${esc(t('f_use'))}</button></div>`:''}
    </div>`;
  }
  /* opción 2: lo escrito a mano, si lo hay */
  if (w.manual){
    html += `<div class="opt is-picked">
      <div class="opt-tag"><span class="ok">${esc(t(S.origin.get(w.key)==='auto'?'bd_auto':'bd_mano'))}</span><span class="k">${esc(t('f_used'))}</span></div>
      <div class="opt-ref">${w.manual}</div>
    </div>`;
  }
  /* opción 3+: candidatas de las fuentes */
  if (S.busyKey === w.key){
    html += `<div class="busy">${esc(t('f_searching', Object.keys(CFG.sources).filter(k=>CFG.sources[k]).map(k=>SOURCES[k].label).join(', ')))}</div>`;
  } else if (cands && !cands.length){
    html += `<div class="nores">${esc(t('f_nores', w.surname + ' ' + w.year))}
      <div style="margin-top:8px"><button class="btn btn--mini btn--ghost" id="fAgain">${esc(t('f_again'))}</button></div></div>`;
  } else if (cands){
    const yN = String(w.year).replace(/[a-h]$/,'');
    html += cands.map((e,n) => {
      const okAuthor = e.authors.some(a => slug(a.last) === slug(w.surname));
      const badYear = e.year && String(e.year) !== yN;
      return `<div class="opt">
        <div class="opt-tag"><span>${esc(e._src)}</span>
          ${okAuthor?`<span class="ok">${esc(t('f_author_ok'))}</span>`:''}
          ${badYear?`<span class="warn">${esc(t('f_year_warn'))}</span>`:''}</div>
        <div class="opt-ref">${fmt(e, w.year)}</div>
        <div style="margin-top:8px"><button class="btn btn--mini btn--keep" data-pick="${n}">${esc(t('f_use'))}</button></div>
      </div>`;
    }).join('');
  }
  body.innerHTML = html;
  foot.innerHTML = '';

  if ($('fAgain')) $('fAgain').onclick = () => { S.cands.delete(w.key); renderPanel(); };
  if ($('manOpen')) $('manOpen').onclick = () => { S.manualKey = w.key; renderFind(); setTimeout(() => $('manBox')?.focus(), 20); };
  if ($('manCancel')) $('manCancel').onclick = () => { S.manualKey = null; renderFind(); };
  if ($('manFetch')) $('manFetch').onclick = async () => {
    const btn = $('manFetch'), raw = $('manId').value.trim();
    if (!raw) return;
    btn.disabled = true; btn.textContent = t('m_fetching');
    let r = null;
    try { r = await resolveIdent(raw); } catch(e){}
    btn.disabled = false; btn.textContent = t('m_fetch');
    if (!r){ toast(t('m_notfound')); return; }
    if (r.link) S.link.set(w.key, r.link);
    if (r.entry && r.entry.fields.title){
      if ($('manBox')) $('manBox').value = stripTags(fmt(r.entry, w.year));
      toast(t('m_filled'));
    } else toast(t('m_linkonly'));
  };
  if ($('manSave')) $('manSave').onclick = () => {
    const v = $('manBox').value.trim(); if (!v){ toast(t('t_missing')); return; }
    S.refOverride.set(w.key, esc(v).replace(/_([^_]+)_/g,'<em>$1</em>'));
    S.origin.set(w.key, 'mano'); S.manualKey = null; advance(); };
  if ($('useBib')) $('useBib').onclick = () => { S.refOverride.delete(w.key); S.origin.delete(w.key); S.link.delete(w.key); renderPanel(); };
  body.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
    const e = cands[+b.dataset.pick];
    S.refOverride.set(w.key, fmt(e, w.year));
    S.origin.set(w.key, 'auto');
    const url = entryLink(e); if (url) S.link.set(w.key, url); else S.link.delete(w.key);
    advance(); });
  bindCommon(body);

  if (!cands && S.busyKey !== w.key && Object.values(CFG.sources).some(Boolean)) autoLookup(w);
}

/* la barra de arriba: obra anterior/siguiente y, en la misma línea,
   el recorrido por las apariciones de esta cita en el texto */
function paintNav(w, q){
  const oi = S.occ.get(w.key) || 0, many = w.hits.length > 1;
  $('subFind').innerHTML = `<div class="nav">
      <button class="arrow" id="fPrev" ${S.findI===0?'disabled':''} title="${esc(t('f_prev'))}">${ICON.left}</button>
      <div class="who"><b>${esc(w.authors)}, ${esc(w.year)}</b>
        <span>${esc(t('f_of', S.findI+1, q.length))} · ${many
          ? `<button class="occ-b" id="occPrev" title="${esc(t('occ_prev'))}" aria-label="${esc(t('occ_prev'))}">${ICON.left}</button>
             <span id="occLbl">${esc(t('occ_n', oi+1, w.hits.length))}</span>
             <button class="occ-b" id="occNext" title="${esc(t('occ_next'))}" aria-label="${esc(t('occ_next'))}">${ICON.right}</button>`
          : `<span id="occLbl">${esc(t('occ_one'))}</span>
             <button class="occ-b" id="occNext" title="${esc(t('a_view'))}" aria-label="${esc(t('a_view'))}">${ICON.eye}</button>`}</span></div>
      <button class="arrow" id="fNext" ${S.findI>=q.length-1?'disabled':''} title="${esc(t('f_next'))}">${ICON.right}</button>
    </div><div class="navbar"><div style="width:${Math.round((S.findI+1)/q.length*100)}%"></div></div>`;
  $('fPrev').onclick = () => { S.findI--; S.manualKey = null; renderPanel(); };
  $('fNext').onclick = () => { S.findI++; S.manualKey = null; renderPanel(); };
  const go = d => {
    const i = many ? (((S.occ.get(w.key)||0) + d) % w.hits.length + w.hits.length) % w.hits.length : 0;
    S.occ.set(w.key, i); jumpTo(w.hits[i].id, false);
    if ($('occLbl')) $('occLbl').textContent = many ? t('occ_n', i+1, w.hits.length) : t('occ_one');
  };
  if ($('occNext')) $('occNext').onclick = () => go(many ? 1 : 0);
  if ($('occPrev')) $('occPrev').onclick = () => go(-1);
}
function advance(){
  const q = findQueue();
  let i = S.findI + 1;
  while (i < q.length && refOf(q[i])) i++;
  S.findI = Math.min(i, q.length - 1);
  S.manualKey = null; renderPanel();
}
async function autoLookup(w){
  S.busyKey = w.key;
  if (S.tab === 'find') renderFind();
  let items = [];
  try { items = await lookup(w); } catch(e){ items = []; }
  S.cands.set(w.key, items);
  S.busyKey = null;
  if (S.tab === 'find') renderPanel();
}

function buildList(style, lang, inclNorms){
  const done = S.works.filter(w => refOf(w));

  const rebuilt = done.map(w => w.manual ? w.manual : formatRef(w.bib, w.year, style, lang))

  return rebuilt.concat(norms.length ? [''].concat(norms) : []);

/* ------------------------------------------------------------- comunes */
function cleanRef(html){
  const d = document.createElement('div'); d.innerHTML = html;
  (function walk(n){
    [...n.childNodes].forEach(c => {
      if (c.nodeType !== 1) return;
      const tag = c.tagName.toLowerCase();
      if (tag === 'br'){ c.replaceWith(document.createTextNode(' ')); return; }
      walk(c);
      if (tag === 'i'){ const e = document.createElement('em'); e.append(...c.childNodes); c.replaceWith(e); }
      else if (tag !== 'em'){ c.replaceWith(...c.childNodes); }
    });
  })(d);
  return d.innerHTML.replace(/\s+/g,' ').trim();
}
function bindCommon(b){
  b.querySelectorAll('[data-jump]').forEach(x => x.onclick = () => jumpTo(x.dataset.jump));
  b.querySelectorAll('[data-cycle]').forEach(x => x.onclick = () => {
    const w = S.works.find(y => y.key===x.dataset.cycle); if (w) cycleTo(w.key, w.hits); });
  b.querySelectorAll('[data-cyclenorm]').forEach(x => x.onclick = () => {
    const n = S.norms.find(y => y.key===x.dataset.cyclenorm); if (n) cycleTo(n.key, n.hits); });
  b.querySelectorAll('[data-confirm]').forEach(x => x.onclick = () => {
    const h = S.hits.find(y => y.id===x.dataset.confirm); if (h) h.status='ok'; renderPanel(); });
  b.querySelectorAll('[data-drop]').forEach(x => x.onclick = () => {
    S.hits = S.hits.filter(y => y.id!==x.dataset.drop); renderPanel(); });
  b.querySelectorAll('[data-killwork]').forEach(x => x.onclick = () => {
    const w = S.works.find(y => y.key===x.dataset.killwork); if (!w) return;
    const ids = new Set(w.hits.map(h=>h.id));
    S.hits = S.hits.filter(h => !ids.has(h.id)); S.refOverride.delete(w.key); renderPanel(); });
  b.querySelectorAll('[data-killnorm]').forEach(x => x.onclick = () => {
    const n = S.norms.find(y => y.key===x.dataset.killnorm); if (!n) return;
    const ids = new Set(n.hits.map(h=>h.id));
    S.hits = S.hits.filter(h => !ids.has(h.id)); renderPanel(); });
  b.querySelectorAll('[data-editfrag]').forEach(x => x.onclick = () => openFragEditor(x.dataset.editfrag));
  b.querySelectorAll('[data-tofind]').forEach(x => x.onclick = () => {
    const i = S.works.findIndex(y => y.key === x.dataset.tofind);
    if (i < 0) return;
    S.findI = i; S.manualKey = x.dataset.tofind; S.lastJumped = null;
    S.tab = 'find'; syncTabs(); renderPanel();
  });
  b.querySelectorAll('[data-ref]').forEach(el => el.addEventListener('blur', () => {
    const w = S.works.find(y => y.key===el.dataset.ref); if (!w) return;
    const clean = cleanRef(el.innerHTML);
    if (!clean){ el.innerHTML = refOf(w)||''; return; }
    if (clean === (refOf(w)||'')) return;
    S.refOverride.set(w.key, clean); S.origin.set(w.key, 'mano'); renderPanel();
  }));
  b.querySelectorAll('[data-norm]').forEach(el => el.addEventListener('blur', () => {
    const n = S.norms.find(y => y.key===el.dataset.norm); if (!n) return;
    const clean = cleanRef(el.innerHTML);
    if (!clean || clean === (n.manual || esc(normTemplate(n.label)))) return;
    S.normOverride.set(n.key, clean); renderPanel();
  }));
}
function syncTabs(){
  $('tabList').setAttribute('aria-selected', S.tab==='list');
  $('tabFind').setAttribute('aria-selected', S.tab==='find');
  $('tabExp').setAttribute('aria-selected', S.tab==='exp');
}

function modal(html, dismissible = true){
  const v = document.createElement('div');
  v.className = 'veil'; v.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(v);
  if (dismissible) v.addEventListener('click', e => { if (e.target===v) v.remove(); });
  return v;
}
function openFragEditor(hitId){
  const h = S.hits.find(x => x.id===hitId); if (!h) return;
  const original = fragOf(h);
  const v = modal(`<h3>${esc(t('ed_frag_h'))}</h3>

      <div><label>${esc(t('ed_year'))}</label><input type="text" id="eY" value="${esc(h.year)}"></div>
    </div>
    <p class="mini-note" style="margin-top:8px">${esc(t('ed_frag_note'))}</p>
    <div class="row"><button class="btn btn--ghost" id="eC">${esc(t('cancel'))}</button>
    <button class="btn btn--key" id="eS">${esc(t('save'))}</button></div>`);
  $('eFrag').addEventListener('input', () => {
    const g = $('eFrag').value.replace(/^[(\[]|[)\]]$/g,'').trim().match(RE_LOOSE);

  });
  $('eFrag').focus();
  $('eC').onclick = () => v.remove();
  $('eS').onclick = () => {
    const nf = $('eFrag').value.trim(), a = $('eA').value.trim(), y = $('eY').value.trim();

    const at = original.indexOf(nf);
    if (nf && at !== -1 && nf.length !== original.length){ h.start += at; h.end = h.start + nf.length; }
    h.authors = tidyAuthors(a); h.year = normYear(y);
    v.remove(); renderPanel();
  };
}

/* =========================================================================
   SELECCIÓN MANUAL EN EL TEXTO
   ========================================================================= */
function paraOffset(pEl, node, offset){
  let acc = 0, done = false;
  (function walk(n){
    if (done) return;
    if (n === node && n.nodeType === 3){ acc += offset; done = true; return; }
    if (n.nodeType === 3){ acc += n.nodeValue.length; return; }
    for (const c of n.childNodes){ walk(c); if (done) return; }
  })(pEl);
  return acc;
}
function showPop(rect, html){
  const pop = $('pop'); pop.innerHTML = html; pop.classList.remove('hidden');
  pop.style.top = (window.scrollY + rect.top - 40)+'px';
  pop.style.left = Math.max(8, window.scrollX + rect.left)+'px';
}
function onSelect(){
  const sel = window.getSelection(), pop = $('pop');
  if (!sel || sel.isCollapsed || !sel.rangeCount){ pop.classList.add('hidden'); return; }
  const r = sel.getRangeAt(0);
  const a = r.startContainer.parentElement?.closest('[data-p]');
  const b = r.endContainer.parentElement?.closest('[data-p]');
  if (!a || a !== b){ pop.classList.add('hidden'); return; }
  const txt = sel.toString().trim();
  if (!txt || txt.length > 160){ pop.classList.add('hidden'); return; }
  const pi = +a.dataset.p;
  const st = paraOffset(a, r.startContainer, r.startOffset);
  const en = paraOffset(a, r.endContainer, r.endOffset);
  showPop(r.getBoundingClientRect(), `<button class="btn btn--mini btn--keep" id="popAdd">${esc(t('mark_cite'))}</button>`);
  $('popAdd').onclick = () => { addManual(pi, st, en, txt); pop.classList.add('hidden'); sel.removeAllRanges(); };
}
function addManual(pi, st, en, txt){
  const g = txt.replace(/^[(\[]|[)\]]$/g,'').trim().match(RE_LOOSE);
  if (g){
    S.hits.push(mkHit(pi, st, en, tidyAuthors(trimStop(g[1])) || g[1], normYear(g[2]), 'manual', 'ok'));
    S.hits.sort((x,z) => x.para-z.para || x.start-z.start); renderPanel(); return;
  }
  const gy = (txt.match(/\b(\d{4}[a-h]?)\b/)||[])[1] || '';
  const ga = trimStop(txt.replace(/[(\[\])]/g,'').replace(/\b\d{4}[a-h]?\b[\s\S]*$/,'').replace(/[,;:]\s*$/,'').trim());
  const v = modal(`<h3>${esc(t('add_h'))}</h3>
    <p class="mini-note">${esc(t('add_sel', txt))}</p>
    <div class="two"><div><label>${esc(t('ed_authors'))}</label><input type="text" id="aA" value="${esc(ga)}"></div>
    <div><label>${esc(t('ed_year'))}</label><input type="text" id="aY" value="${esc(gy)}"></div></div>
    <div class="row"><button class="btn btn--ghost" id="aC">${esc(t('cancel'))}</button>
    <button class="btn btn--key" id="aO">${esc(t('add_btn'))}</button></div>`);
  $('aA').focus();
  $('aC').onclick = () => v.remove();
  $('aO').onclick = () => {
    const a = $('aA').value.trim(), y = $('aY').value.trim();
    if (!a || !y){ toast(t('t_missing')); return; }
    S.hits.push(mkHit(pi, st, en, tidyAuthors(a), normYear(y), 'manual', 'ok'));
    S.hits.sort((x,z) => x.para-z.para || x.start-z.start);
    v.remove(); renderPanel();
  };
}
$('doc').addEventListener('click', e => {
  const m = e.target.closest('mark.cit'); if (!m) return;
  const h = S.hits.find(x => x.id === m.dataset.hit); if (!h) return;
  const pop = $('pop');
  showPop(m.getBoundingClientRect(), h.status === 'sug'
    ? `<button class="btn btn--mini btn--keep" id="pK">${esc(t('a_keep'))}</button><button class="btn btn--mini btn--drop" id="pD">${esc(t('a_drop'))}</button>`
    : `<button class="btn btn--mini btn--ghost" id="pE">${esc(t('a_edit'))}</button><button class="btn btn--mini btn--drop" id="pD">${esc(t('a_remove'))}</button>`);
  if ($('pK')) $('pK').onclick = () => { h.status='ok'; pop.classList.add('hidden'); renderPanel(); };
  if ($('pE')) $('pE').onclick = () => { pop.classList.add('hidden'); if (h.kind!=='ley') openFragEditor(h.id); };
  $('pD').onclick = () => { S.hits = S.hits.filter(x => x.id!==h.id); pop.classList.add('hidden'); renderPanel(); };
});

  if (!e.target.closest('.pop') && !e.target.closest('mark.cit')) setTimeout(onSelect, 0);
});

/* =========================================================================
   CARGA
   ========================================================================= */
const normalizeText = x => String(x)
  .replace(/\u00AD/g,'').replace(/(\p{L})-\s*\n\s*(\p{L})/gu,'$1$2')
  .replace(/[\u2018\u2019\u02BC]/g,'\u2019').replace(/[\u201C\u201D]/g,'"')
  .replace(/\u00A0/g,' ').replace(/[\t ]+/g,' ').trim();

function loadParas(paras){
  S.paras = paras.filter(p => p.text.trim().length);
  S.hits = detect(S.paras);
  buildVocab();
  S.refOverride.clear(); S.normOverride.clear(); S.origin.clear(); S.cands.clear(); S.link.clear();
  S.cycle.clear(); S.occ.clear(); S.lastJumped=null;
  S.tab='list'; S.findI=0; syncTabs(); $('qList').value='';
  renderPanel(); $('scroller').scrollTop = 0;
  const sug = S.hits.filter(h=>h.status==='sug').length, ley = S.hits.filter(h=>h.kind==='ley').length;
  toast(t('t_cites', S.hits.filter(h=>h.status==='ok'&&h.kind!=='ley').length)
    + (ley ? ' · '+t('t_norms', ley) : '') + (sug ? ' · '+t('t_review', sug) : ''));
  if (window.innerWidth <= 900) $('togglePanel').classList.remove('hidden');
}
async function loadDocx(file){
  if (!window.mammoth){ toast(t('t_docx_err')); return; }
  try {
    const res = await window.mammoth.convertToHtml({arrayBuffer: await file.arrayBuffer()});
    const box = document.createElement('div'); box.innerHTML = res.value;
    const paras = [...box.querySelectorAll('p,h1,h2,h3,h4,li,blockquote')].map(el => ({
      tag: /^H[1-3]$/.test(el.tagName) ? el.tagName.toLowerCase() : 'p',
      text: normalizeText(el.textContent||'') }));
    if (!paras.length){ toast(t('t_no_text')); return; }
    loadParas(paras);
  } catch(e){ console.error(e); toast(t('t_docx_err')); }
}
function loadBib(text){
  try {
    const e = parseBib(text);
    if (!e.length){ toast(t('t_bib_none')); return; }
    S.bib = e; S.bibIndex = buildBibIndex(e); indexBibProfile();
    toast(t('t_bib_read', e.length)); renderPanel();
  } catch(err){ console.error(err); toast(t('t_bib_err')); }
}
function wipeAll(){
  DB.del(KEY);
  S.paras=[]; S.hits=[]; S.works=[]; S.norms=[]; S.bib=[]; S.bibIndex=new Map();
  S.cands.clear(); S.refOverride.clear(); S.normOverride.clear(); S.origin.clear(); S.link.clear();
  S.vocab=new Map(); S.bibVenues=new Set(); S.bibSurnames=new Set(); S.findI=0; S.tab='list';
  $('doc').innerHTML=''; $('empty').classList.remove('hidden'); $('qList').value='';
  [...$('ruler').querySelectorAll('.tick')].forEach(x=>x.remove());
  syncTabs(); renderPanel(); toast(t('t_deleted'));
}

const drop = $('drop');
['dragenter','dragover'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add('is-over'); }));
['dragleave','drop'].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove('is-over'); }));
drop.addEventListener('drop', e => {
  const f = e.dataTransfer.files[0]; if (!f) return;
  if (/\.bib(tex)?$/i.test(f.name)) f.text().then(loadBib); else loadDocx(f);
});
$('scroller').addEventListener('scroll', () => $('pop').classList.add('hidden'));
window.addEventListener('resize', drawRuler);
document.addEventListener('keydown', e => {
  if (S.tab !== 'find' || e.target.matches('input, textarea, [contenteditable]')) return;
  const q = findQueue();
  if (e.key === 'ArrowRight' && S.findI < q.length-1){ S.findI++; S.manualKey=null; renderPanel(); }
  if (e.key === 'ArrowLeft' && S.findI > 0){ S.findI--; S.manualKey=null; renderPanel(); }
  if (/^[1-9]$/.test(e.key)){
    const w = q[S.findI], c = w && S.cands.get(w.key);
    if (c && c[+e.key-1]){ const en2=c[+e.key-1];
      S.refOverride.set(w.key, fmt(en2, w.year)); S.origin.set(w.key,'auto');
      const u=entryLink(en2); if (u) S.link.set(w.key,u); advance(); }
  }
});

/* divisor arrastrable */
(function initResizer(){
  const r = $('resizer'), p = $('panel');
  let dragging = false;
  const clamp = px => Math.max(340, Math.min(760, window.innerWidth*0.6, px));
  const apply = px => { p.style.width = clamp(px)+'px'; drawRuler(); };
  const at = e => (e.touches ? e.touches[0].clientX : e.clientX);
  const move = e => { if (dragging) apply(window.innerWidth - at(e)); };
  const stop = () => { if (!dragging) return; dragging=false; r.classList.remove('is-dragging');
    document.body.style.userSelect=''; document.body.style.cursor=''; saveSoon(); };
  const start = e => { if (window.innerWidth <= 900) return; dragging=true; r.classList.add('is-dragging');
    document.body.style.userSelect='none'; document.body.style.cursor='col-resize'; if (e.cancelable) e.preventDefault(); };
  r.addEventListener('mousedown', start);
  r.addEventListener('touchstart', start, {passive:false});
  document.addEventListener('mousemove', move);
  document.addEventListener('touchmove', move, {passive:true});
  document.addEventListener('mouseup', stop);
  document.addEventListener('touchend', stop);
  r.addEventListener('dblclick', () => apply(410));
})();

  $('empty').classList.add('hidden');
  setTimeout(() => toast(t('t_session', S.works.length)), 500);

} else if (!DB.ok){ setTimeout(() => flashSaved(''), 800); }
window.addEventListener('beforeunload', () => { clearTimeout(saveTimer); try { saveNow(); } catch(e){} });
