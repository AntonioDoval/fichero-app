<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fichero</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<style>
:root{
  --paper:#E5E6E2; --sheet:#FBFBF9; --panel:#F1F1EE;
  --ink:#17171B; --ink-soft:#5C5C66; --ink-faint:#8E8E97;
  --mimeo:#4A3DAE; --mimeo-wash:#D9D4F4; --mimeo-line:#B7AFE8;
  --rust:#A8442B; --rust-wash:#F3DBD4; --rust-soft:#E9C4BA;
  --verde:#2C6349; --verde-wash:#D7E6DE; --verde-soft:#B6D4C6;
  --ley:#8A6512; --ley-wash:#EFE2C0; --ley-line:#D6BE7E;
  --rule:#CBCBC4;
  --mono:ui-monospace,"SFMono-Regular","Menlo","Consolas","Liberation Mono",monospace;
  --serif:"Iowan Old Style","Charter","Georgia","Times New Roman",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--mimeo);outline-offset:2px}
.hidden{display:none !important}
svg{display:block}

.shell{display:flex;flex-direction:column;height:100vh;height:100dvh}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:9px 16px;background:var(--sheet);border-bottom:1px solid var(--rule)}
.brand{display:flex;align-items:baseline;gap:9px;margin-right:auto}
.brand .name{font-family:var(--mono);font-size:15px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--mimeo)}
.brand .tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-faint);text-transform:uppercase}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:transparent;color:var(--ink);
  font-family:var(--mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;padding:7px 12px;border-radius:2px;
  transition:background .12s,color .12s;white-space:nowrap}
.btn:hover{background:var(--ink);color:var(--sheet)}
.btn--key{border-color:var(--mimeo);background:var(--mimeo);color:#fff}
.btn--key:hover{background:#3C319A;color:#fff}
.btn--ghost{border-color:var(--rule);color:var(--ink-soft)}
.btn--ghost:hover{background:var(--rule);color:var(--ink)}
.btn--mini{padding:4px 8px;font-size:10.5px;letter-spacing:.07em}
.btn--drop{border-color:var(--rust-soft);background:var(--rust-wash);color:var(--rust)}
.btn--drop:hover{background:var(--rust-soft);color:#5E2113}
.btn--keep{border-color:var(--verde-soft);background:var(--verde-wash);color:var(--verde)}
.btn--keep:hover{background:var(--verde-soft);color:#17402D}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn svg{width:13px;height:13px}

.counters{display:flex;gap:13px;align-items:center}
.count{display:flex;flex-direction:column;line-height:1.1}
.count b{font-family:var(--mono);font-size:16px;font-weight:600}
.count span{font-family:var(--mono);font-size:9px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint)}
.count--ok b{color:var(--verde)} .count--gap b{color:var(--rust)} .count--ley b{color:var(--ley)}
.saved{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);opacity:0;transition:opacity .3s}
.saved.on{opacity:1}

/* ---------------- tres columnas ---------------- */
.main{flex:1;display:flex;min-height:0}
.col-text{flex:1;display:flex;min-width:0;background:var(--sheet)}
.rail{width:30px;flex:none;display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--rule)}
.rail-r{border-right:0;border-left:1px solid var(--rule)}
.rail-btn{width:30px;height:32px;flex:none;border:0;border-bottom:1px solid var(--rule);background:transparent;
  color:var(--ink-faint);display:flex;align-items:center;justify-content:center;padding:0}
.rail-btn:hover{background:var(--mimeo-wash);color:var(--mimeo)}
.rail-btn svg{width:16px;height:16px}
.ruler{flex:1;position:relative;cursor:pointer;min-height:0}
.main.fold-text .col-text,.main.fold-text #rz1{display:none}
.main.fold-detail .col-detail,.main.fold-detail #rz2{display:none}
.tick{position:absolute;left:6px;width:18px;height:2px;background:var(--mimeo);cursor:pointer;border-radius:1px}
.tick:hover{left:3px;width:24px;height:3px}
.tick.is-open{background:var(--rust)} .tick.is-done{background:var(--verde)}
.tick.is-sug{background:var(--rust-soft);height:1px} .tick.is-ley{background:var(--ley-line)}
.scroller{flex:1;overflow-y:auto;padding:36px 5vw 200px;min-width:0}
.doc{max-width:640px;margin:0 auto;font-family:var(--serif);font-size:17px;line-height:1.72;color:#232329}
.doc p{margin:0 0 1.05em}
.doc h1,.doc h2,.doc h3{font-family:var(--mono);font-weight:600;font-size:13.5px;text-transform:uppercase;margin:2.2em 0 .9em;color:var(--mimeo)}
mark.cit{background:var(--mimeo-wash);color:inherit;padding:.05em .1em;border-radius:1px;cursor:pointer;
  box-decoration-break:clone;-webkit-box-decoration-break:clone;border-bottom:1.5px solid var(--mimeo-line)}
mark.cit:hover{background:var(--mimeo-line)}
mark.cit.is-sug{background:transparent;border-bottom:1.5px dashed var(--rust);color:var(--rust)}
mark.cit.is-sug:hover{background:var(--rust-wash)}
mark.cit.is-done{background:var(--verde-wash);border-bottom-color:var(--verde)}
mark.cit.is-ley{background:var(--ley-wash);border-bottom:1.5px solid var(--ley-line)}
mark.cit.is-active{box-shadow:0 0 0 2px var(--ink)}
mark.cit.is-sel{box-shadow:0 0 0 2px var(--mimeo)}

.resizer{width:7px;flex:none;cursor:col-resize;background:var(--rule);position:relative;transition:background .12s}
.resizer::after{content:'';position:absolute;top:50%;left:2px;width:3px;height:38px;transform:translateY(-50%);
  border-left:1px solid var(--ink-faint);border-right:1px solid var(--ink-faint);opacity:.45}
.resizer:hover,.resizer.is-dragging{background:var(--mimeo-line)}

.col{flex:none;display:flex;flex-direction:column;min-height:0;background:var(--panel);border-left:1px solid var(--rule)}
.col-list{width:320px}
.col-detail{width:400px;background:var(--sheet)}
.col-sub{padding:9px 12px;border-bottom:1px solid var(--rule);background:var(--sheet)}
.col-list .col-sub{background:var(--panel)}
.col-body{flex:1;overflow-y:auto;padding:12px}

.chips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.chip{border:1px solid var(--rule);background:var(--sheet);color:var(--ink-soft);font-family:var(--mono);
  font-size:9px;letter-spacing:.07em;text-transform:uppercase;padding:4px 7px;border-radius:10px}
.chip:hover{border-color:var(--ink-faint)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--sheet)}
.chip b{font-weight:600;margin-left:4px;opacity:.7}
.chip.c-gap[aria-pressed="false"]{color:var(--rust);border-color:var(--rust-soft)}
.search{width:100%;padding:6px 8px;border:1px solid var(--rule);border-radius:2px;font-family:var(--mono);font-size:12px;background:var(--sheet);color:var(--ink)}

.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:9.5px;
  letter-spacing:.13em;text-transform:uppercase;color:var(--ink-faint);margin:2px 0 8px}
.gap{margin-top:18px}
.blank{color:var(--ink-faint);font-size:13px;line-height:1.6;padding:8px 2px}

.ficha{background:var(--sheet);border:1px solid var(--rule);border-left:3px solid var(--mimeo);border-radius:2px;
  padding:6px 8px;margin-bottom:5px;cursor:pointer}
.ficha:hover{border-color:var(--ink-faint)}
.ficha.is-done{border-left-color:var(--verde)}
.ficha.is-open{border-left-color:var(--rust)}
.ficha.is-sug{border-left-style:dashed;border-left-color:var(--rust)}
.ficha.is-ley{border-left-color:var(--ley)}
.ficha.is-sel{background:var(--mimeo-wash);border-color:var(--mimeo);box-shadow:inset 0 0 0 1px var(--mimeo)}
.fr{display:flex;align-items:center;gap:6px}
.fk{flex:1;min-width:0;font-family:var(--mono);font-size:12px;font-weight:600;line-height:1.3;word-break:break-word}
.fn{flex:none;font-family:var(--mono);font-size:8.5px;color:var(--ink-faint);border:1px solid var(--rule);border-radius:8px;padding:0 5px}
.fa{flex:none;display:flex;gap:0}
.ico{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border:0;background:transparent;
  color:var(--ink-faint);border-radius:3px;padding:0;text-decoration:none}
.ico svg{width:14px;height:14px}
.ico:hover{background:var(--rule);color:var(--ink)}
.ico.i-drop:hover{background:var(--rust-wash);color:var(--rust)}
.ico.i-keep:hover{background:var(--verde-wash);color:var(--verde)}
.ffrag{font-family:var(--serif);font-size:12px;color:var(--ink-faint);font-style:italic;margin-top:3px;line-height:1.4}
.fwarn{font-size:10.5px;color:var(--rust);margin-top:3px;line-height:1.4}
.fnote{font-size:10.5px;color:var(--ink-faint);margin-top:3px;line-height:1.4}

/* ------------- columna de detalle ------------- */
.nav{display:flex;align-items:center;gap:7px}
.nav .arrow{flex:none;width:28px;height:28px;border:1px solid var(--rule);background:var(--panel);border-radius:2px;
  display:flex;align-items:center;justify-content:center;color:var(--ink-soft)}
.nav .arrow:hover{background:var(--ink);color:var(--sheet);border-color:var(--ink)}
.nav .arrow[disabled]{opacity:.3;pointer-events:none}
.nav .who{flex:1;min-width:0;text-align:center}
.nav .who b{display:block;font-family:var(--mono);font-size:13.5px;font-weight:600;line-height:1.25;word-break:break-word}
.nav .who span{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint)}
.occ-b{border:0;background:transparent;color:var(--ink-faint);padding:0 1px;vertical-align:-3px;border-radius:2px}
.occ-b svg{width:12px;height:12px}
.occ-b:hover{background:var(--rule);color:var(--mimeo)}
.navbar{height:3px;background:var(--rule);margin-top:8px;border-radius:2px;overflow:hidden}
.navbar>div{height:100%;background:var(--mimeo);transition:width .25s}

.ident{display:flex;gap:6px;margin-bottom:8px}
.ident input{flex:1;min-width:0;padding:7px 8px;border:1px solid var(--rule);border-radius:2px;
  font-family:var(--mono);font-size:11.5px;background:var(--panel);color:var(--ink)}
.lbl{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 4px}
.manual textarea{width:100%;min-height:76px;font-family:var(--serif);font-size:14px;padding:8px;border:1px solid var(--rule);
  border-radius:2px;background:var(--panel);color:var(--ink);resize:vertical;margin-bottom:8px}
.manual-acts{display:flex;gap:6px;justify-content:flex-end}
.toggle-man{width:100%;justify-content:center;margin-bottom:12px}

.opt{background:var(--sheet);border:1px solid var(--rule);border-radius:2px;padding:9px 10px;margin-bottom:7px}
.opt.is-bib{border-left:3px solid var(--verde)}
.opt.is-chosen{border-color:var(--verde);box-shadow:0 0 0 1px var(--verde);background:var(--verde-wash)}
.opt-tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-faint);
  display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-bottom:5px}
.opt-tag .ok{color:var(--verde)} .opt-tag .warn{color:var(--rust)}
.opt-ref{font-family:var(--serif);font-size:13.5px;line-height:1.5;color:var(--ink)}
.opt-ref em{font-style:italic}
.opt-acts{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px;align-items:center}
.busy{font-size:12.5px;color:var(--mimeo);background:var(--panel);border:1px dashed var(--mimeo-line);padding:12px;border-radius:2px}
.nores{font-size:12.5px;color:var(--ink-soft);background:var(--panel);border:1px dashed var(--rule);padding:12px;border-radius:2px;line-height:1.5}
.hint{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);
  border-top:1px dotted var(--rule);margin-top:16px;padding-top:8px;text-align:center}
.pick-none{padding:34px 16px;text-align:center;color:var(--ink-faint);font-size:13.5px;line-height:1.6}
.sug-box{background:var(--rust-wash);border:1px solid var(--rust-soft);border-radius:2px;padding:12px}
.sug-box h4{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--rust);margin:0 0 6px}
.sug-box p{font-size:12.5px;color:var(--rust);margin:0 0 10px;line-height:1.45}

.empty{max-width:520px;margin:6vh auto 0}
.empty h2{font-family:var(--mono);font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--mimeo);margin:0 0 14px}
.empty p{color:var(--ink-soft);margin:0 0 14px;font-size:14.5px;line-height:1.6}
.drop{border:1.5px dashed var(--mimeo-line);border-radius:3px;padding:32px 22px;text-align:center;background:var(--panel);margin:20px 0 14px}
.drop.is-over{background:var(--mimeo-wash);border-color:var(--mimeo)}
.paste{width:100%;min-height:120px;border:1px solid var(--rule);border-radius:3px;padding:12px;font-family:var(--serif);
  font-size:15px;background:var(--sheet);color:var(--ink);resize:vertical}
.mini-note{font-size:12.5px;color:var(--ink-faint);line-height:1.55}
.privacy{font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;color:var(--ink-faint);border-top:1px dotted var(--rule);
  padding-top:8px;margin-top:14px;line-height:1.6}

/* botón flotante de exportar */
.fab{position:fixed;right:18px;bottom:18px;z-index:45;box-shadow:0 3px 12px rgba(23,23,27,.22)}

/* modales */
.veil{position:fixed;inset:0;background:rgba(23,23,27,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px;overflow-y:auto}
.modal{background:var(--sheet);border-radius:3px;padding:20px;max-width:480px;width:100%;border:1px solid var(--ink);margin:auto}
.modal.wide{max-width:760px}
.modal h3{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 12px;color:var(--mimeo)}
.modal label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-faint);margin:12px 0 4px}
.modal input[type=text],.modal textarea,.modal select{width:100%;padding:8px;border:1px solid var(--rule);border-radius:2px;font:inherit;background:var(--panel);color:var(--ink)}
.modal textarea{min-height:80px;font-family:var(--serif);resize:vertical}
.modal .row{display:flex;gap:8px;margin-top:16px;justify-content:flex-end;flex-wrap:wrap}
.modal .two{display:flex;gap:10px}
.modal .two>div{flex:1}
.check{display:flex;align-items:flex-start;gap:8px;margin:9px 0;font-size:13.5px;line-height:1.4}
.check input{margin-top:3px}
.check span small{display:block;color:var(--ink-faint);font-size:11.5px}
.cfg-group{border-top:1px solid var(--rule);padding-top:12px;margin-top:16px}
.cfg-group>h4{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 6px}

.bib-doc{font-family:var(--serif);font-size:14.5px;line-height:1.62;max-height:46vh;overflow-y:auto;
  border:1px solid var(--rule);border-radius:2px;background:var(--panel);padding:12px 14px;margin-top:6px}
.bib-item{position:relative;padding:3px 0 3px 1.7em;text-indent:-1.7em;border-radius:2px;margin-bottom:.4em}
.bib-item:hover{background:var(--sheet)}
.bib-ref{outline:0;border-radius:2px}
.bib-ref em{font-style:italic}
.bib-ref[contenteditable="true"]:focus{background:var(--sheet);box-shadow:0 0 0 2px var(--mimeo);padding:2px 4px}
.bib-meta{display:flex;align-items:center;gap:5px;flex-wrap:wrap;text-indent:0;margin-top:2px;opacity:0;transition:opacity .12s}
.bib-item:hover .bib-meta,.bib-item:focus-within .bib-meta{opacity:1}
.badge{font-family:var(--mono);font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;border:1px solid var(--rule);
  border-radius:8px;padding:1px 6px;color:var(--ink-faint)}
.badge.b-bib{color:var(--verde);border-color:var(--verde-soft)}
.badge.b-auto{color:var(--mimeo);border-color:var(--mimeo-line)}

.pop{position:absolute;z-index:40;background:var(--sheet);border:1px solid var(--ink);border-radius:3px;padding:4px;display:flex;gap:4px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--sheet);font-family:var(--mono);
  font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 16px;border-radius:2px;z-index:80;max-width:80vw;text-align:center}

/* ---------------- pantallas angostas ---------------- */
.ptabs{display:none;border-bottom:1px solid var(--rule);background:var(--sheet)}
.ptab{flex:1;border:0;background:transparent;padding:10px 4px;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--ink-faint);border-bottom:2px solid transparent}
.ptab[aria-selected="true"]{color:var(--mimeo);border-bottom-color:var(--mimeo)}
.ptab .dot{display:inline-block;min-width:15px;margin-left:4px;font-size:9px;background:var(--rust);color:#fff;border-radius:8px;padding:1px 4px}

@media (max-width:1150px){
  .main.narrow #rz2{display:none}
  .main.narrow .col-list,.main.narrow .col-detail{width:var(--sidew,360px)}
  .main.narrow .ptabs{display:flex}
  .main.narrow.show-list .col-detail{display:none}
  .main.narrow.show-detail .col-list{display:none}
}
@media (max-width:820px){
  .main #rz1,.main #rz2{display:none}
  .main .col-list,.main .col-detail{position:fixed;inset:auto 0 0 0;height:64vh;width:100% !important;
    border-left:0;border-top:1px solid var(--ink);z-index:30;box-shadow:0 -6px 20px rgba(0,0,0,.12)}
  .main.hide-panel .col-list,.main.hide-panel .col-detail{display:none}
  .scroller{padding:22px 16px 68vh}
  .fab{bottom:auto;top:auto;right:14px;bottom:calc(64vh + 12px)}
  .main.hide-panel .fab{bottom:14px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}
</style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><span class="name">Fichero</span></div>
    <div class="counters" id="counters"></div>
    <span class="saved" id="saved"></span>
    <button class="btn btn--ghost" id="btnCfg"></button>
    <button class="btn btn--ghost" id="btnBib" data-i18n="load_bib"></button>
    <button class="btn btn--ghost" id="btnClear"></button>
  </header>

  <div class="main" id="main">
    <div class="rail" id="railLeft">
      <button class="rail-btn" id="btnFold"></button>
      <div class="ruler" id="ruler"></div>
    </div>

    <div class="col-text" id="colText">
      <div class="scroller" id="scroller">
        <div class="empty" id="empty">
          <h2 data-i18n="empty_h"></h2>
          <p data-i18n="empty_p"></p>
          <div class="drop" id="drop">
            <p class="mini-note" data-i18n="drop_hint"></p>
            <button class="btn btn--key" id="btnPick" data-i18n="pick_file"></button>
          </div>
          <p class="mini-note" data-i18n="paste_hint"></p>
          <textarea class="paste" id="pasteBox"></textarea>
          <div style="margin-top:10px"><button class="btn" id="btnPaste" data-i18n="paste_btn"></button></div>
          <p class="privacy" data-i18n="privacy"></p>
        </div>
        <div class="doc" id="doc"></div>
      </div>
    </div>

    <div class="resizer" id="rz1"></div>

    <aside class="col col-list" id="colList">
      <div class="ptabs" role="tablist">
        <button class="ptab" id="ptabList" role="tab" aria-selected="true"></button>
        <button class="ptab" id="ptabDetail" role="tab" aria-selected="false"></button>
      </div>
      <div class="col-sub">
        <div class="chips" id="chips"></div>
        <input class="search" id="qList" type="search" autocomplete="off">
      </div>
      <div class="col-body" id="listBody"></div>
    </aside>

    <div class="resizer" id="rz2"></div>

    <aside class="col col-detail" id="colDetail">
      <div class="ptabs" role="tablist">
        <button class="ptab" id="ptabList2" role="tab" aria-selected="false"></button>
        <button class="ptab" id="ptabDetail2" role="tab" aria-selected="true"></button>
      </div>
      <div class="col-sub" id="detailSub"></div>
      <div class="col-body" id="detailBody"></div>
    </aside>

    get: k => { try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch(e){ return null; } },
    set: (k,v) => { if (ok) localStorage.setItem(k,v); else mem[k] = v; },
    del: k => { try { ok ? localStorage.removeItem(k) : delete mem[k]; } catch(e){} } };

   Trampas: varias citas por paréntesis (con ; o con ,), año sin coma previa,
   apellidos compuestos y partículas, siglas institucionales, et al., 2020a,
   localizadores, citas narrativas, cf./véase, ibid./op. cit., normativa,

const UC = '\\p{Lu}';
const LW = "[\\p{L}'\u2019\\-]";
const NW = `${UC}${LW}*`;
/* las partículas van en minúscula (caso sensible, a propósito: si "de" o "la"
   valieran también en mayúscula sin más, "La Plata" pasaría por apellido).
   Pero al empezar una oración o una cita narrativa sí llevan mayúscula inicial
   —"Van der Linden (2008)"—, así que sumamos esa única variante capitalizada. */
const PART_LC = "de las|de los|de la|del|de|da|das|do|dos|di|della|dello|van der|van den|van|von|le|la|du|des|d'|St\\.";
const PART_CAP = PART_LC.split('|').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('|');
const PART = `(?:${PART_LC}|${PART_CAP}|O'|Mc|Mac)`;
const PART_SET = new Set(['de','del','da','das','do','dos','di','della','dello','van','von','le','la','du','des',"d'","o'",'mc','mac']);
const PART_B = `(?<![\\p{L}])(?:${PART})`;
const SUR_IN = `(?:${PART_B}\\s+)?${NW}(?:[\\s\\-]+(?:${PART_B}\\s+)?${NW}){0,3}`;
const SUR_NA = `(?:${PART_B}\\s+)?${NW}(?:\\s+(?:${PART_B}\\s+)?${NW}){0,1}`;
/* partículas que en castellano también son preposición o artículo suelto:
   "de Artopoulos" puede ser "de Artopoulos [apellido]" o "un trabajo de Artopoulos".
   Las de origen holandés/portugués/francés casi no tienen ese doble uso. */
const AMBIG_PART = new Set(['de','del','la','las','los']);
const SEP = "(?:\\s*,\\s*|\\s+(?:y|e|and|&)\\s+)";
const ETAL = "(?:\\s*,?\\s*et\\s*al\\.?)?";
const SIGLA = "(?:\\s*\\[[^\\]]{1,60}\\])?";
const YEAR = "(?:\\d{4}[a-h]?(?![\\p{L}\\d])|s\\.\\s?[fd]\\.|s\\/f|n\\.\\s?d\\.|en prensa|in press|no prelo|forthcoming)";
const ORIG = "(?:\\s*\\[\\d{4}[a-z]?\\])?";
const LOCNUM = "(?:\\d+(?:\\s*[-–—]\\s*\\d+)?|[IVXLCivxlc]{1,7}(?![\\p{L}]))";
/* sin marcador de página explícito el localizador no puede ser un número de
   cuatro cifras: si no, ", 2020b" se lee como página y se come el año siguiente */
const LOCSAFE = "(?:\\d{1,3}(?!\\d)(?:\\s*[-–—]\\s*\\d{1,4})?|[IVXLCivxlc]{1,7}(?![\\p{L}]))";
const LOC = `(?:\\s*[:,]\\s*(?:(?:pp?\\.|p[áa]gs?\\.|cap\\.)\\s*${LOCNUM}|${LOCSAFE}))?`;
const AUTHORS_IN = `${SUR_IN}(?:${SEP}${SUR_IN})*${ETAL}`;
const AUTHORS_NA = `${SUR_NA}(?:${SEP}${SUR_NA})*${ETAL}`;

const YSERIE = `${YEAR}${ORIG}${LOC}(?:\\s*,\\s*${YEAR}${ORIG}${LOC})*`;
const RE_NARR = new RegExp(`(${AUTHORS_NA})${SIGLA}\\s*\\(\\s*(${YSERIE})\\s*\\)`, 'gu');
const RE_YTOK = new RegExp(`${YEAR}`, 'gu');
/* en castellano, inglés y portugués una cita con varios autores siempre lleva

function trimStop(a0){
  let a = String(a0).trim().replace(/\s+/g,' ');
  for (let g = 0; g < 6; g++){
    const m = a.match(new RegExp(`^(${LW}+)\\s+(?=\\p{Lu})`,'u'));
    if (!m) break;
    const tok = deacc(m[1]).toLowerCase();
    if (PART_SET.has(tok)) break;
    if (STOP.has(tok)) a = a.slice(m[0].length); else break;
  }
  const first = deacc(a.split(/\s+/)[0]||'').toLowerCase();
  if (!a || (STOP.has(first) && !PART_SET.has(first))) return '';
  return a;
}

function buildNameStats(paras){
  const st = new Map();
  const get = w => { const k = slug(w); if (!st.has(k)) st.set(k, {total:0, withYear:0, paren:0}); return st.get(k); };
  const RE_W = /\p{Lu}[\p{L}'\u2019-]{2,}/gu;
  paras.forEach(p => {
    const txt = p.text; let m;
    RE_W.lastIndex = 0;
    while ((m = RE_W.exec(txt)) !== null){
      const rec = get(m[0]); rec.total++;
      const after = txt.slice(m.index + m[0].length, m.index + m[0].length + 14);
      if (/^\s*[,(]?\s*\(?\s*\d{4}/.test(after)) rec.withYear++;
      /* forma inequívoca (Autor, año) o ; Autor, año: nadie escribe (Argentina, 2006) */
      const before = txt.slice(Math.max(0, m.index-2), m.index);
      if (/[(;]\s*$/.test(before) && /^\s*,\s*\d{4}[a-h]?\s*[):;,]/.test(after)) rec.paren++;
    }
  });
  return st;
}
/* devuelve true si el candidato parece un lugar y conviene mandarlo a dudosas */
function looksLikePlace(name){
  if (!S.nameStats || !S.nameStats.size) return false;
  if (/[\s\-]/.test(name)) return false;                 // compuesto o con partícula: no es un topónimo suelto
  const k = slug(name);
  if (S.bibSurnames.has(k)) return false;                  // está en tu bibliografía
  const rec = S.nameStats.get(k);
  if (!rec) return false;
  if (rec.paren > 0) return false;                         // en algún lado se cita como (Autor, año)
  const soft = SOFT_PLACES.has(k);
  const ratio = rec.withYear / Math.max(1, rec.total);
  if (soft) return ratio < 0.75;
  return rec.total >= 4 && ratio < 0.34;
}

function detect(paras){
  const hits = []; let last = null;
  S.nameStats = buildNameStats(paras);
  paras.forEach((p, pi) => {
    const text = p.text, taken = [];
    const busy = (s,e) => taken.some(r => s < r[1] && e > r[0]);
    const claim = (s,e) => taken.push([s,e]);

    if (CFG.laws){
      let m;
      /* si la norma viene seguida de su sigla —"Ley de Contrato de Trabajo (LCT)"—
         absorbemos el paréntesis para no contarla dos veces */
      const withSigla = end => {
        const tail = text.slice(end).match(/^\s*\(\s*[\p{Lu}]{2,8}\s*\)/u);
        return tail ? end + tail[0].length : end;
      };
      RE_NORMA.lastIndex = 0;
      while ((m = RE_NORMA.exec(text)) !== null){
        const h = mkHit(pi, m.index, withSigla(m.index+m[0].length),
          m[0].replace(/\s+/g,' ').replace(/\s*\/\s*/,'/').trim(), '', 'ley', 'ok');
        hits.push(h); claim(h.start, h.end);
      }
      RE_CUERPO.lastIndex = 0;
      while ((m = RE_CUERPO.exec(text)) !== null){
        if (busy(m.index, m.index+m[0].length)) continue;
        const h = mkHit(pi, m.index, withSigla(m.index+m[0].length), m[0].replace(/\s+/g,' ').trim(), '', 'ley', 'ok');
        hits.push(h); claim(h.start, h.end);
      }
    }

    const reParen = /\(([^()]{2,500})\)/g;
    let pm;
    while ((pm = reParen.exec(text)) !== null){
      const inner = pm[1], base = pm.index + 1, covered = [];
      RE_UNIT.lastIndex = 0;
      let u;
      while ((u = RE_UNIT.exec(inner)) !== null){
        const authors = tidyAuthors(trimStop(u[1]));
        const firstTok = (authors.split(' ')[0] || u[1].trim().split(' ')[0]);
        const shift = u[0].indexOf(firstTok);
        const st = base + u.index + (shift > 0 ? shift : 0);
        let end = u.index + u[0].length;
        /* serie de años del mismo autor: (Marins 2020, 2020b, 2025) */
        const extra = [];
        const tail = new RegExp(`^\\s*,\\s*(${YEAR})${ORIG}${LOC}`, 'u');
        let rest = inner.slice(end), m2;
        while ((m2 = rest.match(tail)) !== null){
          extra.push({ year: normYear(m2[1]), st: base + end, en: base + end + m2[0].length });
          end += m2[0].length; rest = inner.slice(end);
        }
        covered.push([u.index, end]);
        const en = base + u.index + u[0].length;
        if (!authors || authors.length < 2 || busy(st,en)) continue;
        const status = multiOk(authors) ? 'ok' : 'sug';
        const h = mkHit(pi, st, en, authors, normYear(u[2]), 'paren', status);
        hits.push(h); claim(st,en); if (status === 'ok') last = h;
        extra.forEach(x => {
          if (busy(x.st, x.en)) return;
          const e2 = mkHit(pi, x.st, x.en, authors, x.year, 'paren', status);
          hits.push(e2); claim(x.st, x.en); if (status === 'ok') last = e2;
        });
        RE_UNIT.lastIndex = end;
      }
      let cursor = 0; const left = [];
      covered.sort((a,b) => a[0]-b[0]).forEach(([a,b]) => { if (a > cursor) left.push([cursor,a]); cursor = Math.max(cursor,b); });
      if (cursor < inner.length) left.push([cursor, inner.length]);
      left.forEach(([a,b]) => {
        const seg = inner.slice(a,b);
        if (!/\d{4}/.test(seg) || !new RegExp(UC,'u').test(seg) || seg.length > 110) return;
        if (/^\s*[,;.\s]*$/.test(seg)) return;
        if (/^[\s,;]*(?:tabla|cuadro|gr[áa]fico|figura|anexo|art)/i.test(seg)) return;
        const ym = seg.match(/\b(\d{4}[a-h]?)\b/);
        const am = trimStop(seg.replace(/\b\d{4}[a-h]?\b[\s\S]*$/,'').replace(/[,;:]\s*$/,'').trim());
        if (!ym || !am || am.length < 3) return;
        const st = base + a + (seg.length - seg.replace(/^[\s,;]+/,'').length), en = base + b;
        if (busy(st,en)) return;
        const h = mkHit(pi, st, en, tidyAuthors(am), normYear(ym[1]), 'paren', 'sug');
        hits.push(h); claim(st,en);
      });
    }

    RE_NARR.lastIndex = 0;
    let nm;
    while ((nm = RE_NARR.exec(text)) !== null){
      const st0 = nm.index, en0 = nm.index + nm[0].length;
      if (busy(st0,en0)) continue;
      const cleaned = trimStop(nm[1]); if (!cleaned) continue;
      const shift = nm[0].indexOf(cleaned);
      const st = st0 + (shift > 0 ? shift : 0);
      const authors = tidyAuthors(cleaned);
      const status = (multiOk(authors) && !looksLikePlace(authors)) ? 'ok' : 'sug';
      /* Marins (2020, 2025) → una cita por año */
      const yearsAt = nm.index + nm[0].indexOf(nm[2]);
      const years = []; RE_YTOK.lastIndex = 0;
      let ym2;
      while ((ym2 = RE_YTOK.exec(nm[2])) !== null)
        years.push({ y: normYear(ym2[0]), st: yearsAt + ym2.index, en: yearsAt + ym2.index + ym2[0].length });
      if (!years.length) continue;
      const solo = years.length === 1;
      years.forEach((yy, i) => {
        /* con varios años, cada uno reclama solo su tramo: si el primero se
           quedara con todo el paréntesis, los demás quedarían bloqueados */
        const a = i === 0 ? st : yy.st;
        const b = i === 0 ? (solo ? en0 : yy.en) : yy.en;
        if (busy(a,b)) return;
        const h = mkHit(pi, a, b, authors, yy.y, 'narr', status);
        hits.push(h); claim(a,b); if (status === 'ok') last = h;
      });
    }

    RE_ANAPH.lastIndex = 0;
    let am2;
    while ((am2 = RE_ANAPH.exec(text)) !== null){
      const st = am2.index, en = st + am2[0].length;
      if (busy(st,en) || !last) continue;
      const h = mkHit(pi, st, en, last.authors, last.year, 'anaf', 'ok');
      hits.push(h); claim(st,en);
    }
  });
  hits.sort((a,b) => a.para - b.para || a.start - b.start);
  return vetPlaces(hits, paras);
}

/* =========================================================================
   VETO DE TOPÓNIMOS
   No hay lista que alcance, así que usamos el documento como evidencia:
   un apellido aparece casi siempre pegado a un año; un lugar aparece
   constantemente en prosa corrida y solo de vez en cuando con año.
   Nada se descarta: lo sospechoso baja a "dudosas" y se confirma con un click.
   ========================================================================= */
const PLACES = new Set(['argentina','brasil','brazil','chile','uruguay','paraguay','bolivia','peru','ecuador',
'venezuela','colombia','mexico','cuba','nicaragua','honduras','guatemala','panama','haiti','jamaica','dominicana',
'espana','portugal','francia','italia','alemania','inglaterra','escocia','irlanda','suiza','austria','belgica',
'holanda','suecia','noruega','dinamarca','finlandia','islandia','polonia','hungria','rumania','bulgaria','grecia',
'turquia','rusia','ucrania','china','japon','india','corea','vietnam','tailandia','indonesia','filipinas',
'australia','egipto','marruecos','argelia','tunez','nigeria','kenia','sudafrica','etiopia','senegal','canada',
'europa','asia','africa','oceania','latinoamerica','sudamerica','norteamerica','centroamerica','caribe','mercosur',
'montevideo','brasilia','bogota','caracas','quito','asuncion','managua','tegucigalpa','habana','nairobi','bangkok',
'estambul','moscu','praga','varsovia','amsterdam','bruselas','copenhague','estocolmo','helsinki','dublin',
'edimburgo','lisboa','atenas','beirut','teheran','jerusalen','viena','ginebra','zurich','recife','fortaleza',
'curitiba','montreal','vancouver','chicago','boston','seattle','houston','johannesburgo','singapur','shanghai',
'beijing','pekin','tokio','osaka','seul','manila','yakarta','alegre','janeiro','horizonte','paulo']);

function buildNameFreq(){
  const f = new Map(), re = /\p{Lu}[\p{L}'\u2019-]*/gu;
  S.paras.forEach(p => { let m; re.lastIndex = 0;
    while ((m = re.exec(p.text)) !== null){ const k = slug(m[0]); f.set(k, (f.get(k)||0) + 1); } });
  return f;
}
function phraseCount(name, cache){
  if (cache.has(name)) return cache.get(name);
  const pat = name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/\s+/g,'\\s+');
  let n = 0;
  try {
    const re = new RegExp('(?<![\\p{L}])' + pat + '(?![\\p{L}])', 'gu');
    S.paras.forEach(p => { const m = p.text.match(re); if (m) n += m.length; });
  } catch(e){ n = 0; }
  cache.set(name, n); return n;
}
function vetPlaces(hits, paras){
  if (!hits.length) return hits;
  const freq = buildNameFreq(), cache = new Map();
  const parenSur = new Set(), parenCompound = new Set();
  hits.forEach(h => { if (h.kind === 'paren' && h.status === 'ok' && h.year){
    const fs = firstSurname(h.authors);
    parenSur.add(slug(fs));
    if (/\s/.test(fs)) parenCompound.add(slug(fs));
  }});
  const withYear = new Map();
  hits.forEach(h => { if (h.kind === 'ley') return;
    const k = slug(firstSurname(h.authors));
    withYear.set(k, (withYear.get(k)||0) + 1); });
  const partRe = new RegExp('^(?:' + PART + ')\\s', 'iu');

  hits.forEach(h => {
    if (h.kind !== 'narr' || h.status !== 'ok') return;

    /* "de Artopoulos" — de/la/del/las/los también son preposición o artículo
       sueltos en castellano. Si el documento confirma "Artopoulos" solo en
       otro lado y nunca confirma la forma compuesta, la partícula es prosa,
       no apellido: se recorta antes de seguir evaluando esta cita. */
    const pm = h.authors.match(new RegExp('^(' + PART + ')\\s+(\\S.*)$', 'iu'));
    if (pm){
      const particle = deacc(pm[1]).toLowerCase().replace(/\s+/g,' ');
      const bareCand = pm[2].replace(/\s+et al\.?$/i,'').trim();
      const fullCand = h.authors.replace(/\s+et al\.?$/i,'').trim();
      if (AMBIG_PART.has(particle) && parenSur.has(slug(bareCand)) && !parenCompound.has(slug(fullCand))){
        h.start += h.authors.length - pm[2].length;
        h.authors = pm[2];
      }
    }

    const name = h.authors.replace(/\s+et al\.?$/i,'').trim();
    const sur = firstSurname(name), k = slug(sur);
    if (S.bibSurnames.has(k)) return;        // figura en tu .bib
    if (parenSur.has(k)) return;             // en otro lado se lo cita entre paréntesis
    if (partRe.test(name)) return;           // De Certeau, van der Linden
    const toks = name.split(/\s+/);
    if (toks.some(x => PLACES.has(slug(x))) || PLACES.has(slug(name))){ h.status = 'sug'; return; }
    if (toks.length > 2) return;
    const total = toks.length === 1 ? (freq.get(k) || 0) : phraseCount(name, cache);
    const wy = withYear.get(k) || 0;
    if (total >= 8 && wy / total <= 0.25) h.status = 'sug';   // mucho en prosa, poco con año
  });
  return hits;
}

/* =========================================================================
   AGRUPACIÓN
   ========================================================================= */
function groupWorks(hits){
  const map = new Map();
  hits.filter(h => h.status === 'ok' && h.kind !== 'ley').forEach(h => {
    const key = slug(h.authors) + '|' + slug(h.year);
    if (!map.has(key)) map.set(key, { key, authors:h.authors, year:h.year,
      surname:firstSurname(h.authors), hits:[], bib:null, dup:false, merged:false });
    map.get(key).hits.push(h);
  });
  let list = [...map.values()];
  if (CFG.mergeEtal){
    const byFirst = new Map();
    list.forEach(w => { const k = slug(w.surname)+'|'+slug(w.year);
      if (!byFirst.has(k)) byFirst.set(k,[]); byFirst.get(k).push(w); });
    const out = [];
    byFirst.forEach(g => {
      if (g.length === 1){ out.push(g[0]); return; }
      const etal = g.filter(w => /et al\./i.test(w.authors)), full = g.filter(w => !/et al\./i.test(w.authors));
      if (etal.length && full.length === 1){
        const target = full[0];
        etal.forEach(e => e.hits.forEach(h => target.hits.push(h)));
        target.merged = true; out.push(target);
      } else g.forEach(w => { w.dup = true; out.push(w); });
    });
    list = out;
  }
  list.forEach(w => {
    w.hits.sort((a,b) => a.para - b.para || a.start - b.start);
    w.manual = S.refOverride.get(w.key) || null;
  });
  list.sort((a,b) => slug(a.surname).localeCompare(slug(b.surname)) || String(a.year).localeCompare(String(b.year)));
  return list;
}
function groupNorms(hits){
  const map = new Map();
  hits.filter(h => h.kind === 'ley').forEach(h => {
    const key = slug(h.authors);
    if (!map.has(key)) map.set(key, { key, label:h.authors, hits:[] });
    map.get(key).hits.push(h);
  });
  const list = [...map.values()];
  list.forEach(n => n.manual = S.normOverride.get(n.key) || null);
  list.sort((a,b) => a.label.localeCompare(b.label,'es',{numeric:true}));
  return list;
}

/* =========================================================================
   BIBTEX
   ========================================================================= */
const LATEX = [
  [/\\'\{?a\}?/g,'á'],[/\\'\{?e\}?/g,'é'],[/\\'\{?i\}?/g,'í'],[/\\'\{?o\}?/g,'ó'],[/\\'\{?u\}?/g,'ú'],
  [/\\'\{?A\}?/g,'Á'],[/\\'\{?E\}?/g,'É'],[/\\'\{?I\}?/g,'Í'],[/\\'\{?O\}?/g,'Ó'],[/\\'\{?U\}?/g,'Ú'],
  [/\\~\{?n\}?/g,'ñ'],[/\\~\{?N\}?/g,'Ñ'],[/\\~\{?a\}?/g,'ã'],[/\\~\{?o\}?/g,'õ'],
  [/\\"\{?u\}?/g,'ü'],[/\\"\{?U\}?/g,'Ü'],[/\\`\{?a\}?/g,'à'],[/\\`\{?e\}?/g,'è'],
  [/\\\^\{?e\}?/g,'ê'],[/\\\^\{?a\}?/g,'â'],[/\\\^\{?o\}?/g,'ô'],[/\\c\{?c\}?/g,'ç'],
  [/\\&/g,'&'],[/\\%/g,'%'],[/\\_/g,'_'],[/\\\$/g,'$'],[/\\#/g,'#'],
  [/\\emph\{([^}]*)\}/g,'$1'],[/\\textit\{([^}]*)\}/g,'$1'],[/--/g,'–']
];
const delatex = s => { let x = String(s); LATEX.forEach(([r,v]) => x = x.replace(r,v));
  return x.replace(/[{}]/g,'').replace(/\s+/g,' ').trim(); };

function parseBib(src){
  const entries = []; let i = 0;
  while (i < src.length){
    const at = src.indexOf('@', i); if (at === -1) break;
    const ob = src.indexOf('{', at); if (ob === -1) break;
    const type = src.slice(at+1, ob).trim().toLowerCase();
    if (['comment','string','preamble'].includes(type)){ i = ob+1; continue; }
    let d = 0, end = -1;
    for (let j = ob; j < src.length; j++){ if (src[j]==='{') d++; else if (src[j]==='}'){ d--; if (!d){ end=j; break; } } }
    if (end === -1) break;
    const body = src.slice(ob+1, end); i = end+1;
    const comma = body.indexOf(',');
    const e = { type, citekey:(comma===-1?body:body.slice(0,comma)).trim(), fields:{} };
    const raw = comma === -1 ? '' : body.slice(comma+1);
    let k = 0;
    while (k < raw.length){
      const eq = raw.indexOf('=', k); if (eq === -1) break;
      const name = raw.slice(k, eq).replace(/^[\s,]+/,'').trim().toLowerCase();
      let p = eq+1; while (p < raw.length && /\s/.test(raw[p])) p++;
      let val = '';
      if (raw[p] === '{'){ let dd=0,q=p; for (; q<raw.length; q++){ if(raw[q]==='{')dd++; else if(raw[q]==='}'){dd--; if(!dd)break;} }
        val = raw.slice(p+1,q); p = q+1; }
      else if (raw[p] === '"'){ let q=p+1; while (q<raw.length && !(raw[q]==='"' && raw[q-1]!=='\\')) q++;
        val = raw.slice(p+1,q); p = q+1; }
      else { let q=p; while (q<raw.length && raw[q] !== ',' && raw[q] !== '\n') q++; val = raw.slice(p,q); p = q; }
      if (name) e.fields[name] = delatex(val);
      const nc = raw.indexOf(',', p); k = nc === -1 ? raw.length : nc+1;
    }
    if (Object.keys(e.fields).length) entries.push(e);
  }
  entries.forEach(e => {
    e.authors = splitAuthors(e.fields.author || '');
    e.editors = splitAuthors(e.fields.editor || '');
    const y = String(e.fields.year || e.fields.date || '').match(/\d{4}/);
    e.year = y ? y[0] : '';
  });
  return entries;
}
function splitAuthors(raw){
  if (!raw) return [];
  return raw.split(/\s+and\s+/i).map(a => {
    a = a.trim(); if (!a) return null;
    if (a.includes(',')){ const [l,f] = a.split(','); return { last:l.trim(), first:(f||'').trim() }; }
    const tk = a.split(/\s+/);
    if (tk.length === 1) return { last:tk[0], first:'' };
    let idx = tk.findIndex((x,i) => i>0 && /^[a-záéíóúñüãõç']/.test(x));
    if (idx === -1) idx = tk.length-1;
    return { last:tk.slice(idx).join(' '), first:tk.slice(0,idx).join(' ') };
  }).filter(Boolean);
}
function buildBibIndex(entries){
  const idx = new Map();
  const push = (k,e) => { if(!k) return; if(!idx.has(k)) idx.set(k,[]); idx.get(k).push(e); };
  entries.forEach(e => {
    const ppl = e.authors.length ? e.authors : e.editors;
    if (!ppl.length) return;
    push(slug(ppl[0].last)+'|'+e.year, e);
    ppl.slice(1).forEach(p => push('any:'+slug(p.last)+'|'+e.year, e));
  });
  return idx;
}
/* perfil disciplinar implícito en tu propia bibliografía */
function indexBibProfile(){
  S.bibVenues = new Set(); S.bibSurnames = new Set();
  S.bib.forEach(e => {
    [e.fields.journal, e.fields.journaltitle, e.fields.booktitle, e.fields.publisher]
      .filter(Boolean).forEach(v => { if (slug(v).length > 4) S.bibVenues.add(slug(v)); });
    (e.authors||[]).concat(e.editors||[]).forEach(p => S.bibSurnames.add(slug(p.last)));
  });
}
function matchWork(w){
  if (!S.bibIndex.size) return null;
  const sur = slug(w.surname), yF = String(w.year), yN = yF.replace(/[a-h]$/,'');
  const c = S.bibIndex.get(sur+'|'+yF) || S.bibIndex.get(sur+'|'+yN) || S.bibIndex.get('any:'+sur+'|'+yN);
  return (c && c.length) ? { entry:c[0], ambiguous:c.length>1, alts:c } : null;
}

/* =========================================================================
   VOCABULARIO DEL DOCUMENTO Y PALABRAS DE CONTEXTO
   ========================================================================= */
const tokenize = s => deacc(String(s)).toLowerCase().replace(/[^a-z0-9áéíóúñü\s]/g,' ')
  .split(/\s+/).filter(w => w.length >= 5 && !STOP.has(w) && !/^\d+$/.test(w));
/* para lo que escribís a mano en "refinar búsqueda" el filtro es más laxo:
   una revista o editorial corta ("OIT", "UBA") no debería perderse por el
   umbral de longitud que sí tiene sentido para barrer prosa corrida */
const tokenizeManual = s => deacc(String(s)).toLowerCase().replace(/[^a-z0-9áéíóúñü\s]/g,' ')
  .split(/\s+/).filter(w => w.length >= 2 && !STOP.has(w));

function buildVocab(){
  const f = new Map();
  S.paras.forEach(p => tokenize(p.text).forEach(w => f.set(w, (f.get(w)||0)+1)));
  /* nos quedamos con los términos frecuentes: son el campo semántico de la tesis */
  S.vocab = new Map([...f.entries()].filter(([,n]) => n >= 3).sort((a,b) => b[1]-a[1]).slice(0, 400));
}
/* términos que rodean a esta cita en particular */
function ctxWords(w, n = 5){
  const manualRaw = S.refineKw.get(w.key);
  if (manualRaw){
    /* al refinar, la búsqueda usa SOLO lo que escribiste — nada de contexto
       automático mezclado, para que el resultado cambie de verdad */
    return tokenizeManual(manualRaw).slice(0, 8);
  }
  const bag = new Map();
  const own = new Set(slug(w.authors).match(/[a-z]+/g) || []);
  if (CFG.useCtx) w.hits.slice(0, 4).forEach(h => {
    const txt = S.paras[h.para] ? S.paras[h.para].text : '';
    const seg = txt.slice(Math.max(0, h.start-240), Math.min(txt.length, h.end+240));
    tokenize(seg).forEach(t2 => {
      if (own.has(t2) || bag.has(t2)) return;
      bag.set(t2, 1 + (S.vocab.has(t2) ? 1 : 0));
    });
  });
  return [...bag.entries()].sort((a,b) => b[1]-a[1]).slice(0, n).map(x => x[0]);
}

/* =========================================================================
   FORMATOS DE REFERENCIA
   ========================================================================= */
const initials = f => !f ? '' : f.split(/[\s.]+/).filter(Boolean).map(x => x[0].toUpperCase()+'.').join(' ');
function joinNames(names, conj){
  if (!names.length) return '';
  if (names.length === 1) return names[0];
  if (names.length > 20) return names.slice(0,19).join(', ')+', … '+names[names.length-1];
  return names.slice(0,-1).join(', ')+` ${conj} `+names[names.length-1];
}
const apaNames = (ppl,c) => joinNames(ppl.map(p => initials(p.first) ? `${p.last}, ${initials(p.first)}` : p.last), c);
const fullNames = (ppl,c) => joinNames(ppl.map((p,i) => i===0
  ? (p.first ? `${p.last}, ${p.first}` : p.last) : (p.first ? `${p.first} ${p.last}` : p.last)), c);

function formatRef(entry, year, style, lang){
  const L = REFL[lang] || REFL.es, c = L.conj;
  const f = entry.fields || {}, ty = entry.type;
  const Y = year || entry.year || L.nd;
  const T = f.title || '—';
  const em = s => `<em>${esc(s)}</em>`;
  const pages = f.pages ? f.pages.replace(/--/g,'–') : '';
  const jour = f.journal || f.journaltitle || '';
  const book = f.booktitle || '';
  const pub = f.publisher || f.institution || f.organization || f.school || '';
  const doi = f.doi ? (String(f.doi).startsWith('http') ? f.doi : 'https://doi.org/'+f.doi) : (f.url || '');
  const ppl = entry.authors && entry.authors.length ? entry.authors : (entry.editors||[]);
  let out;

  if (style === 'mla9'){
    const A = fullNames(ppl, c);
    if (ty==='article') out = `${esc(A)}. "${esc(T)}." ${jour?em(jour):''}${f.volume?`, vol. ${esc(f.volume)}`:''}${f.number?`, no. ${esc(f.number)}`:''}, ${esc(Y)}${pages?`, ${L.pp} ${esc(pages)}`:''}.`;
    else if (ty==='incollection'||ty==='inbook') out = `${esc(A)}. "${esc(T)}." ${book?em(book):''}, ${esc(pub)}, ${esc(Y)}${pages?`, ${L.pp} ${esc(pages)}`:''}.`;
    else out = `${esc(A)}. ${em(T)}. ${esc(pub)}, ${esc(Y)}.`;
    if (doi) out += ` ${esc(doi)}.`;
  } else if (style === 'chicago'){
    const A = fullNames(ppl, c);
    if (ty==='article') out = `${esc(A)}. ${esc(Y)}. "${esc(T)}." ${jour?em(jour):''}${f.volume?` ${esc(f.volume)}`:''}${f.number?` (${esc(f.number)})`:''}${pages?`: ${esc(pages)}`:''}.`;
    else if (ty==='incollection'||ty==='inbook') out = `${esc(A)}. ${esc(Y)}. "${esc(T)}." ${L.in} ${book?em(book):''}${pages?`, ${esc(pages)}`:''}. ${esc(pub)}.`;
    else out = `${esc(A)}. ${esc(Y)}. ${em(T)}. ${esc(pub)}.`;
    if (doi) out += ` ${esc(doi)}.`;
  } else {
    const A = apaNames(ppl, c);
    const link = doi ? ` ${esc(doi)}` : '';
    if (ty==='article'||ty==='periodical'){
      out = `${esc(A)} (${esc(Y)}). ${esc(T)}. ${jour?em(jour):''}${f.volume?', '+em(f.volume):''}${f.number?`(${esc(f.number)})`:''}${pages?`, ${esc(pages)}`:''}.${link}`;
    } else if (ty==='incollection'||ty==='inbook'||ty==='chapter'){
      const eds = (entry.editors||[]).length
        ? `${joinNames((entry.editors).map(p => initials(p.first)?`${initials(p.first)} ${p.last}`:p.last), c)} (${entry.editors.length>1?L.eds:L.ed}), ` : '';
      out = `${esc(A)} (${esc(Y)}). ${esc(T)}. ${L.in} ${esc(eds)}${book?em(book):''}${pages?` (${L.pp} ${esc(pages)})`:''}. ${esc(pub)}.${link}`;
    } else if (ty==='inproceedings'||ty==='conference'){
      out = `${esc(A)} (${esc(Y)}). ${esc(T)} [${L.paper}]. ${book?em(book):''}${pub?'. '+esc(pub):''}.${link}`;
    } else if (ty==='phdthesis'||ty==='mastersthesis'||ty==='thesis'){
      const kind = ty==='phdthesis'?L.phd:(ty==='mastersthesis'?L.ms:(f.type||L.thesis));
      out = `${esc(A)} (${esc(Y)}). ${em(T)} [${esc(kind)}, ${esc(f.school||f.institution||'s/i')}].${link}`;
    } else if (ty==='techreport'||ty==='report'){
      out = `${esc(A)} (${esc(Y)}). ${em(T)}${f.number?` (${esc(f.number)})`:''}. ${esc(pub)}.${link}`;
    } else if (ty==='online'||ty==='misc'||ty==='electronic'){
      out = `${esc(A)} (${esc(Y)}). ${em(T)}.${(f.howpublished||pub)?' '+esc(f.howpublished||pub)+'.':''}${link}`;
    } else {
      out = `${esc(A)} (${esc(Y)}). ${em(T)}${f.edition?` (${esc(f.edition)} ${L.edn})`:''}. ${esc(pub)}.${link}`;
    }
  }
  return out.replace(/\s+\./g,'.').replace(/\.{2,}/g,'.').replace(/\s{2,}/g,' ').replace(/,\s*\./g,'.').trim();
}
const fmt = (entry, year) => formatRef(entry, year, CFG.style, CFG.refLang);
function normTemplate(label, style, lang){
  const L = lang || CFG.refLang;
  if (L === 'en') return `${label} of [year]. [Title of the statute]. [Date]. [Official gazette].`;
  if (L === 'pt') return `${label} de [ano]. [Título da norma]. [Data]. [Diário Oficial].`;
  return `${label} de [año]. [Título de la norma]. [Fecha de sanción]. Boletín Oficial [N°].`;
}

/* =========================================================================
   FUENTES (libres, sin clave, opcionales)
   ========================================================================= */
const mkEntry = (type, authors, year, fields, src, lang) =>
  ({ type, authors, editors:[], year:String(year||''), fields, _src:src, _lang:lang||'' });
const splitDisplay = name => {
  const tk = String(name).trim().split(/\s+/);
  return tk.length === 1 ? { last:tk[0], first:'' } : { last:tk[tk.length-1], first:tk.slice(0,-1).join(' ') };
};
const jget = async u => { const r = await fetch(u); if (!r.ok) throw new Error(r.status); return r.json(); };

const CR_TYPE = {'journal-article':'article','book':'book','book-chapter':'incollection','proceedings-article':'inproceedings','report':'techreport','dissertation':'phdthesis'};
const OA_TYPE = {'article':'article','book-chapter':'incollection','book':'book','dissertation':'phdthesis','report':'techreport'};

const crossrefItem = it => mkEntry(CR_TYPE[it.type]||'misc',
  (it.author||[]).map(a => ({last:a.family||a.name||'', first:a.given||''})).filter(a=>a.last),
  it.issued?.['date-parts']?.[0]?.[0] || '',
  { title:[].concat(it.title||[])[0]||'', journal:[].concat(it['container-title']||[])[0]||'',
    booktitle:[].concat(it['container-title']||[])[0]||'', volume:it.volume||'', number:it.issue||'',
    pages:it.page||'', publisher:it.publisher||'', doi:it.DOI||'' }, 'Crossref', (it.language||'').slice(0,2));

const openalexItem = it => {
  const loc = it.primary_location?.source?.display_name || '';
  const e = mkEntry(OA_TYPE[it.type]||'misc',
    (it.authorships||[]).map(a => splitDisplay(a.author?.display_name || a.raw_author_name || '')).filter(a=>a.last),
    it.publication_year||'',
    { title:it.title||it.display_name||'', journal:loc, booktitle:loc,
      volume:it.biblio?.volume||'', number:it.biblio?.issue||'',
      pages:[it.biblio?.first_page,it.biblio?.last_page].filter(Boolean).join('–'),
      publisher:it.primary_location?.source?.host_organization_name||'',
      doi:(it.doi||'').replace('https://doi.org/','') }, 'OpenAlex', it.language||'');
  /* si la fuente primaria es un repositorio, "publisher" suele ser la
     institución que alojó el archivo, no la editorial real del libro */
  e._srcType = it.primary_location?.source?.type || '';
  return e;
};

/* recupera una referencia a partir de un DOI, un ISBN o una URL pegada */
async function resolveIdent(raw){
  const s0 = String(raw||'').trim(); if (!s0) return null;
  const doi = (s0.match(/10\.\d{4,9}\/[^\s"'<>]+/)||[])[0];
  if (doi){
    const clean = doi.replace(/[.,;)\]]+$/,'');
    try { const j = await jget('https://api.crossref.org/works/'+encodeURIComponent(clean));
      if (j.message) return { entry:crossrefItem(j.message), link:'https://doi.org/'+clean }; } catch(e){}
    try { const j = await jget('https://api.openalex.org/works/doi:'+encodeURIComponent(clean));
      if (j && (j.title||j.display_name)) return { entry:openalexItem(j), link:'https://doi.org/'+clean }; } catch(e){}
    return { entry:null, link:'https://doi.org/'+clean };
  }
  if (!/^https?:\/\//.test(s0)){
    const isbn = (s0.replace(/[-\s]/g,'').match(/\b(?:97[89])?\d{9}[\dXx]\b/)||[])[0];
    if (isbn){
      try {
        const j = await jget(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
        const d = j['ISBN:'+isbn];
        if (d) return { entry: mkEntry('book',
          (d.authors||[]).map(a => splitDisplay(a.name||'')).filter(a=>a.last),
          (String(d.publish_date||'').match(/\d{4}/)||[''])[0],
          { title:d.title||'', publisher:(d.publishers||[])[0]?.name||'' }, 'Open Library'),
          link: d.url||'' };
      } catch(e){}
    }
    return null;
  }
  return { entry:null, link:s0 };
}

async function qCrossref(sur, year, kw){
  const u = `https://api.crossref.org/works?query.author=${encodeURIComponent(sur)}`
    + (kw.length ? `&query.bibliographic=${encodeURIComponent(kw.join(' '))}` : '')
    + (/^\d{4}$/.test(year) ? `&filter=from-pub-date:${year}-01-01,until-pub-date:${year}-12-31` : '')
    + `&rows=6&select=title,author,issued,container-title,volume,issue,page,publisher,DOI,type,language`;
  const j = await jget(u);
  return (j.message?.items||[]).map(crossrefItem);
}
async function qOpenAlex(sur, year, kw){
  const build = withArea => {
    const f = [`raw_author_name.search:${sur}`];
    if (/^\d{4}$/.test(year)) f.push(`publication_year:${year}`);
    if (withArea && AREAS[CFG.area] && AREAS[CFG.area].length)
      f.push('primary_topic.field.id:' + AREAS[CFG.area].map(n => 'fields/'+n).join('|'));
    if (CFG.pubLang) f.push('language:' + CFG.pubLang);
    return `https://api.openalex.org/works?filter=${encodeURIComponent(f.join(','))}&per-page=6`;
  };
  let j;
  try { j = await jget(build(true)); }
  catch(e){ j = await jget(build(false)); }        // si el filtro de área falla, buscamos sin él
  if (!(j.results||[]).length && (AREAS[CFG.area]||[]).length) { try { j = await jget(build(false)); } catch(e){} }
  return (j.results||[]).map(openalexItem);
}
async function qDoaj(sur, year, kw){
  let q = `bibjson.author.name:"${sur}"` + (/^\d{4}$/.test(year) ? ` AND bibjson.year:${year}` : '');
  const j = await jget(`https://doaj.org/api/search/articles/${encodeURIComponent(q)}?pageSize=6`);
  return (j.results||[]).map(r => {
    const b = r.bibjson||{}, doi = (b.identifier||[]).find(i => i.type==='doi');
    return mkEntry('article', (b.author||[]).map(a => splitDisplay(a.name||'')).filter(a=>a.last), b.year||'',
      { title:b.title||'', journal:b.journal?.title||'', volume:b.journal?.volume||'', number:b.journal?.number||'',
        pages:[b.start_page,b.end_page].filter(Boolean).join('–'), publisher:b.journal?.publisher||'',
        doi:doi?doi.id:'' }, 'DOAJ', (b.journal?.language||[])[0]||'');
  });
}
async function qOpenLibrary(sur, year, kw){
  const q = `author:"${sur}"` + (/^\d{4}$/.test(year) ? ` first_publish_year:${year}` : '')
          + (kw.length ? ' ' + kw.slice(0,2).join(' ') : '');
  const j = await jget(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=6&fields=title,author_name,first_publish_year,publisher,language`);
  return (j.docs||[]).map(d => mkEntry('book', (d.author_name||[]).map(splitDisplay), d.first_publish_year||'',
    { title:d.title||'', publisher:(d.publisher||[])[0]||'' }, 'Open Library',
    ({spa:'es',eng:'en',por:'pt'})[(d.language||[])[0]] || ''));
}
const QFN = { crossref:qCrossref, openalex:qOpenAlex, doaj:qDoaj, openlibrary:qOpenLibrary };

/* puntuar en vez de filtrar: si el orden se equivoca, la buena sigue estando */
function scoreCand(e, w, kw){
  const target = slug(w.surname), yN = String(w.year).replace(/[a-h]$/,'');
  let s = 0;
  if (String(e.year) === yN) s += 4; else if (Math.abs(+e.year - +yN) === 1) s += 1;
  if (slug((e.authors[0]||{}).last||'') === target) s += 4;
  else if (e.authors.some(a => slug(a.last) === target)) s += 2;
  const venue = slug(e.fields.journal || e.fields.booktitle || '');
  if (venue && S.bibVenues.has(venue)) s += 2.5;
  if (slug(e.fields.publisher||'') && S.bibVenues.has(slug(e.fields.publisher))) s += 1.5;
  let co = 0;
  e.authors.forEach(a => { if (slug(a.last) !== target && S.bibSurnames.has(slug(a.last))) co++; });
  s += Math.min(co, 2) * 1.2;
  const tt = new Set(tokenize(e.fields.title || ''));
  let voc = 0, ctx = 0;
  tt.forEach(x => { if (S.vocab.has(x)) voc++; });
  /* coincidencia por subcadena, no por token exacto: así una palabra clave
     corta ("OIT", "UBA") escrita a mano también cuenta */
  const titleSlug = slug(e.fields.title || '');
  kw.forEach(k => { if (k.length >= 3 && titleSlug.includes(k)) ctx++; });
  /* si el candidato viene de "refinar búsqueda", kw es lo que escribiste a
     mano: pesa más fuerte porque es una decisión deliberada, no una pista */
  const kwWeight = S.refineKw.has(w.key) ? 2.4 : 1.3;
  s += Math.min(voc, 4) * 0.7 + Math.min(ctx, 4) * kwWeight;
  if (e._lang && CFG.pubLang && e._lang === CFG.pubLang) s += 1;
  else if (e._lang && !CFG.pubLang && e._lang === CFG.refLang) s += 0.5;
  if (e.fields.doi) s += 0.5;
  if (!e.fields.title) s -= 5;
  /* en un libro o capítulo indexado desde un repositorio, "editorial" suele
     ser la institución que alojó el archivo, no quien lo publicó de verdad.
     No lo marcamos, pero si hay algo mejor, que aparezca primero. */
  if (e._srcType === 'repository' && (e.type === 'book' || e.type === 'incollection')) s -= 1.5;
  return s;
}
async function lookup(w){
  const sur = w.surname, year = String(w.year).replace(/[a-h]$/,'');
  const kw = ctxWords(w);
  const active = Object.keys(CFG.sources).filter(k => CFG.sources[k]);
  const res = await Promise.allSettled(active.map(k => QFN[k](sur, year, kw)));
  const seen = new Set(), out = [];
  res.forEach(r => { if (r.status !== 'fulfilled') return;
    r.value.forEach(e => {
      const k = e.fields.doi ? slug(e.fields.doi) : slug(e.fields.title)+e.year;
      if (!k || seen.has(k)) return; seen.add(k); out.push(e);
    });
  });
  out.forEach(e => e._score = scoreCand(e, w, kw));
  out.sort((a,b) => b._score - a._score);
  return out.filter(e => e._score > 0).slice(0, 8);
}

   ========================================================================= */
function renderDoc(){
  const doc = $('doc');
  if (!S.paras.length){ doc.innerHTML=''; return; }
  $('empty').classList.add('hidden');
  const byPara = new Map();
  S.hits.forEach(h => { if(!byPara.has(h.para)) byPara.set(h.para,[]); byPara.get(h.para).push(h); });
  const resolved = new Set(), selHits = new Set();
  S.works.forEach(w => { if (refOf(w)) w.hits.forEach(h => resolved.add(h.id)); });
  const cur = selItem();
  if (cur && cur.hits) cur.hits.forEach(h => selHits.add(h.id));
  doc.innerHTML = S.paras.map((p,i) => {
    const marks = (byPara.get(i)||[]).slice().sort((a,b)=>a.start-b.start);
    let out='', pos=0;
    marks.forEach(h => {
      if (h.start < pos) return;
      out += esc(p.text.slice(pos, h.start));
      const cls = ['cit'];
      if (h.kind === 'ley') cls.push('is-ley');
      else if (h.status === 'sug') cls.push('is-sug');
      else if (resolved.has(h.id)) cls.push('is-done');
      if (selHits.has(h.id)) cls.push('is-sel');
      out += `<mark class="${cls.join(' ')}" data-hit="${h.id}">${esc(p.text.slice(h.start,h.end))}</mark>`;
      pos = h.end;
    });
    out += esc(p.text.slice(pos));
    return `<${p.tag||'p'} data-p="${i}">${out||'&nbsp;'}</${p.tag||'p'}>`;
  }).join('');
  requestAnimationFrame(drawRuler);
}
function drawRuler(){
  const ruler = $('ruler');
  [...ruler.querySelectorAll('.tick')].forEach(x => x.remove());
  const total = $('scroller').scrollHeight; if (!total) return;
  const H = ruler.clientHeight;
  document.querySelectorAll('mark.cit').forEach(m => {
    const top = m.offsetTop + (m.offsetParent ? m.offsetParent.offsetTop : 0);
    const el = document.createElement('div');
    el.className = 'tick' + (m.classList.contains('is-ley') ? ' is-ley'
      : m.classList.contains('is-sug') ? ' is-sug'
      : m.classList.contains('is-done') ? ' is-done' : (S.bib.length ? ' is-open' : ''));
    el.style.top = (Math.round((top/total)*(H-12))+6)+'px';
    el.title = m.textContent;
    el.onclick = ev => { ev.stopPropagation(); if (S.foldText) setFold(false); jumpTo(m.dataset.hit, false); };
    ruler.appendChild(el);
  });
}
function jumpTo(id, hidePanel = true){
  if (S.foldText) setFold(false);
  const el = document.querySelector(`mark[data-hit="${id}"]`); if (!el) return;
  el.scrollIntoView?.({behavior:'smooth', block:'center'});
  document.querySelectorAll('mark.is-active').forEach(m => m.classList.remove('is-active'));
  el.classList.add('is-active'); setTimeout(() => el.classList.remove('is-active'), 2400);
  if (hidePanel && window.innerWidth <= 820){ S.hidePanel = true; layout(); }
}
function cycleTo(key, hits){
  if (!hits || !hits.length) return;
  const i = (S.cycle.get(key) || 0) % hits.length;
  jumpTo(hits[i].id);
  S.cycle.set(key, i + 1);
  if (hits.length > 1) toast(t('occ_n', i+1, hits.length));
}
function linkOf(w){
  const saved = S.link.get(w.key); if (saved) return saved;
  if (w.bib){
    const f = w.bib.fields || {};
    if (f.doi) return String(f.doi).startsWith('http') ? f.doi : 'https://doi.org/'+f.doi;
    if (f.url && /^https?:/.test(f.url)) return f.url;
  }
  const m = stripTags(refOf(w) || '').match(/https?:\/\/[^\s<>"')]+/);
  return m ? m[0] : null;
}
const entryLink = e => {
  const f = e.fields || {};
  if (f.doi) return String(f.doi).startsWith('http') ? f.doi : 'https://doi.org/'+f.doi;
  return (f.url && /^https?:/.test(f.url)) ? f.url : '';
};

const refOf = w => w.manual || (w.bib ? fmt(w.bib, w.year) : null);
const originOf = w => w.manual ? (S.origin.get(w.key)==='auto'?'auto':'mano') : (w.bib ? 'bib' : null);
const pendingWorks = () => S.works.filter(w => !refOf(w));
const iconBtn = (act, key, icon, cls='') =>
  `<button class="ico ${cls}" ${act}="${key}" title="${esc(t(icon.k))}" aria-label="${esc(t(icon.k))}">${ICON[icon.i]}</button>`;

function selItem(){
  if (!S.sel) return null;
  if (S.sel.kind === 'work') return S.works.find(w => w.key === S.sel.key) || null;
  if (S.sel.kind === 'norm') return S.norms.find(n => n.key === S.sel.key) || null;
  return S.hits.find(h => h.id === S.sel.key && h.status === 'sug') || null;
}
/* lista visible según filtro y búsqueda; también gobierna el teclado y las flechas */
function visibleItems(){
  const q = slug($('qList').value || '');
  const hit = s => !q || slug(s).includes(q);
  const out = [];
  const wantSug = S.filter === 'all' || S.filter === 'sug';
  const wantWork = S.filter === 'all' || S.filter === 'pend';
  const wantNorm = S.filter === 'all' || S.filter === 'norm';
  if (wantSug) S.hits.filter(h => h.status === 'sug' && hit(h.authors+h.year+fragOf(h)))
    .forEach(h => out.push({kind:'sug', key:h.id, hits:[h], label:`${h.authors}, ${h.year}`, ref:h}));
  if (wantWork) S.works.filter(w => hit(w.authors+w.year) && (S.filter !== 'pend' || !refOf(w)))
    .forEach(w => out.push({kind:'work', key:w.key, hits:w.hits, label:`${w.authors}, ${w.year}`, ref:w}));
  if (wantNorm) S.norms.filter(n => hit(n.label))
    .forEach(n => out.push({kind:'norm', key:n.key, hits:n.hits, label:n.label, ref:n}));
  return out;
}
function select(kind, key, jump = true){
  if (S.sel && S.sel.kind === kind && S.sel.key === key) return;
  S.sel = {kind, key};
  S.changing.delete(key); S.manualOpen = false; S.refineOpen = null;
  S.lastJumped = null;
  clearTimeout(S.selTimer);
  render();
  /* seleccionar desde cualquier lado —lista, teclado, o un click en el
     manuscrito— siempre trae la ficha correspondiente a la vista */
  document.querySelector(`[data-card="${kind}:${key}"]`)?.scrollIntoView?.({block:'nearest'});
  if (jump){
    const it = selItem();
    const hits = it && (it.hits || [it]);
    if (hits && hits[0]){ S.occ.set(key, 0); S.lastJumped = key; setTimeout(() => jumpTo(hits[0].id, false), 30); }
  }
  /* la búsqueda espera a que te quedes en una: evita disparar una consulta por click */
  if (kind === 'work'){
    S.selTimer = setTimeout(() => {
      const w = S.works.find(x => x.key === key);
      if (w && !refOf(w) && !S.cands.has(key)) autoLookup(w);
    }, 400);
  }
}
function moveSel(d){
  const items = visibleItems(); if (!items.length) return;
  let i = items.findIndex(x => S.sel && x.kind === S.sel.kind && x.key === S.sel.key);
  i = i < 0 ? (d > 0 ? 0 : items.length-1) : Math.min(items.length-1, Math.max(0, i + d));
  select(items[i].kind, items[i].key);
  const card = document.querySelector(`[data-card="${items[i].kind}:${items[i].key}"]`);
  card?.scrollIntoView?.({block:'nearest'});
}

          ${iconBtn('data-editfrag', h.id, {i:'pencil', k:'a_edit'})}</span></div>
        <div class="ffrag">“${esc(fragOf(h))}”</div></div>`;
    } else if (it.kind === 'work'){
      const w = it.ref, h0 = w.hits[0], frag = fragOf(h0);
      const shows = slug(frag) !== slug(w.authors + w.year);
      html += `<div class="ficha ${refOf(w)?'is-done':(S.bib.length?'is-open':'')} ${isSel?'is-sel':''}"
          data-card="work:${w.key}" data-sel="work:${w.key}"><div class="fr">
        <span class="fk">${esc(w.authors)}, ${esc(w.year)}</span>
        <span class="fn">${w.hits.length}×</span>

        ${shows ? `<div class="ffrag">“${esc(frag)}”</div>` : ''}
        ${w.merged ? `<div class="fnote">${esc(t('merged'))}</div>` : ''}
        ${w.dup ? `<div class="fwarn">${esc(t('dup'))}</div>` : ''}</div>`;
    } else {
      const n = it.ref;
      html += `<div class="ficha is-ley ${isSel?'is-sel':''}" data-card="norm:${n.key}" data-sel="norm:${n.key}"><div class="fr">
        <span class="fk">${esc(n.label)}</span><span class="fn">${n.hits.length}×</span>

    const [kind, ...rest] = c.dataset.sel.split(':');
    select(kind, rest.join(':'));
    if (window.innerWidth <= 1150){ S.narrowTab = 'detail'; layout(); }
  }));
}

function renderDetail(){
  const sub = $('detailSub'), body = $('detailBody');
  const it = selItem();
  if (!it){
    sub.innerHTML = '';
    body.innerHTML = `<div class="pick-none">${esc(t('sel_none'))}</div>`;
    return;
  }
  const items = visibleItems();
  const idx = items.findIndex(x => x.kind === S.sel.kind && x.key === S.sel.key);
  const hits = it.hits || [it];
  paintNav(it, hits, idx, items);

  if (S.sel.kind === 'sug'){ renderSug(body, it); return; }
  if (S.sel.kind === 'norm'){ renderNorm(body, it); return; }
  renderWork(body, it);
}

function paintNav(it, hits, idx, items){
  const key = S.sel.key, oi = S.occ.get(key) || 0, many = hits.length > 1;
  const label = S.sel.kind === 'norm' ? it.label : `${it.authors}, ${it.year}`;
  $('detailSub').innerHTML = `<div class="nav">
      <button class="arrow" id="dPrev" ${idx<=0?'disabled':''} title="${esc(t('f_prev'))}">${ICON.left}</button>
      <div class="who"><b>${esc(label)}</b>
        <span>${esc(t('f_of', idx+1, items.length))} · ${many
          ? `<button class="occ-b" id="occPrev" title="${esc(t('occ_prev'))}" aria-label="${esc(t('occ_prev'))}">${ICON.left}</button>
             <span id="occLbl">${esc(t('occ_n', oi+1, hits.length))}</span>
             <button class="occ-b" id="occNext" title="${esc(t('occ_next'))}" aria-label="${esc(t('occ_next'))}">${ICON.right}</button>`
          : `<span id="occLbl">${esc(t('occ_one'))}</span>
             <button class="occ-b" id="occNext" title="${esc(t('a_view'))}" aria-label="${esc(t('a_view'))}">${ICON.eye}</button>`}</span></div>
      <button class="arrow" id="dNext" ${idx>=items.length-1?'disabled':''} title="${esc(t('f_next'))}">${ICON.right}</button>
    </div><div class="navbar"><div style="width:${Math.round((idx+1)/items.length*100)}%"></div></div>`;
  $('dPrev').onclick = () => moveSel(-1);
  $('dNext').onclick = () => moveSel(1);
  const go = d => {
    const i = many ? (((S.occ.get(key)||0) + d) % hits.length + hits.length) % hits.length : 0;
    S.occ.set(key, i); jumpTo(hits[i].id, false);
    if ($('occLbl')) $('occLbl').textContent = many ? t('occ_n', i+1, hits.length) : t('occ_one');
  };
  if ($('occNext')) $('occNext').onclick = () => go(many ? 1 : 0);
  if ($('occPrev')) $('occPrev').onclick = () => go(-1);
  window._occGo = go;
}

function renderWork(body, w){
  const chosen = refOf(w), changing = S.changing.has(w.key);
  const cands = S.cands.get(w.key), doiC = S.doiCand.get(w.key);
  let html = '';

  /* mientras no haya una referencia elegida, o si pediste cambiar: campo de
     identificador, refinar búsqueda e ingreso manual, todo a la vista */
  if (!chosen || changing){
    html += `<div class="ident">
        <input type="text" id="idBox" placeholder="${esc(t('m_ident'))}">
        <button class="btn btn--mini" id="idFetch">${esc(t('m_fetch'))}</button>
      </div>`;

    if (S.refineOpen === w.key){
      html += `<div class="manual"><textarea id="refBox" placeholder="${esc(t('refine_ph'))}">${esc(S.refineKw.get(w.key)||'')}</textarea>
        <div class="manual-acts">
          <button class="btn btn--mini btn--ghost" id="refCancel">${esc(t('cancel'))}</button>
          <button class="btn btn--mini btn--key" id="refGo">${esc(t('refine_go'))}</button>
        </div></div>`;
    } else if (S.manualOpen){
      html += `<div class="manual"><textarea id="manBox" placeholder="${esc(t('f_manual_ph'))}">${esc(chosen?stripTags(chosen):'')}</textarea>
        <div class="manual-acts">
          <button class="btn btn--mini btn--ghost" id="manCancel">${esc(t('cancel'))}</button>
          <button class="btn btn--mini btn--key" id="manSave">${esc(t('save'))}</button>
        </div></div>`;
    } else {
      html += `<div class="opt-acts" style="margin-bottom:12px">
        <button class="btn btn--ghost btn--mini" id="manOpen">${ICON.pencil}${esc(t('m_open'))}</button>
        <button class="btn btn--ghost btn--mini" id="refOpen">${ICON.tune}${esc(t('refine_open'))}</button>
      </div>`;
    }
  }

  if (chosen && !changing){
    /* ya resuelta: se muestra sola, con cambiar / editar / quitar */
    const o = originOf(w), link = linkOf(w);
    html += `<div class="opt is-chosen">
      <div class="opt-tag"><span class="ok">${esc(t('f_chosen'))}</span><span>${esc(t('bd_'+o))}</span></div>
      <div class="opt-ref">${chosen}</div>
      <div class="opt-acts">
        <button class="btn btn--mini btn--ghost" id="wChange">${ICON.redo}${esc(t('f_change'))}</button>
        <button class="btn btn--mini btn--ghost" id="wEdit">${ICON.pencil}${esc(t('a_edit'))}</button>
        ${link ? `<a class="ico" href="${esc(link)}" target="_blank" rel="noopener" title="${esc(t('e_link'))}">${ICON.ext}</a>` : ''}
        ${w.manual ? `<button class="btn btn--mini btn--drop" id="wClear">${esc(t('f_clear'))}</button>` : ''}
      </div></div>`;
  } else {
    /* sin resolver, o pediste cambiar: van todas las opciones */
    if (w.bib){
      html += optBox('f_bib_opt', fmt(w.bib, w.year), 'is-bib', `<button class="btn btn--mini btn--keep" id="useBib">${esc(t('f_use'))}</button>`, true);
    }
    if (doiC){
      html += optBox('m_ident', fmt(doiC, w.year), '', `<button class="btn btn--mini btn--keep" data-pickdoi="1">${esc(t('f_use'))}</button>`, true);
    }
    if (S.busyKey === w.key){
      html += `<div class="busy">${esc(t('f_searching', Object.keys(CFG.sources).filter(k=>CFG.sources[k]).map(k=>SOURCES[k].label).join(', ')))}</div>`;
    } else if (cands && !cands.length){
      html += `<div class="nores">${esc(t('f_nores', w.surname + ' ' + w.year))}
        <div style="margin-top:8px"><button class="btn btn--mini btn--ghost" id="wAgain">${esc(t('f_again'))}</button></div></div>`;
    } else if (cands){
      const yN = String(w.year).replace(/[a-h]$/,'');
      html += cands.map((e,n) => {
        const okA = e.authors.some(a => slug(a.last) === slug(w.surname));
        const badY = e.year && String(e.year) !== yN;
        const tags = `<span>${esc(e._src)}</span>${okA?`<span class="ok">${esc(t('f_author_ok'))}</span>`:''}${badY?`<span class="warn">${esc(t('f_year_warn'))}</span>`:''}`;
        return `<div class="opt"><div class="opt-tag">${tags}</div>
          <div class="opt-ref">${fmt(e, w.year)}</div>
          <div class="opt-acts"><button class="btn btn--mini btn--keep" data-pick="${n}">${esc(t('f_use'))}</button></div></div>`;
      }).join('');
      if (changing) html += `<div style="margin-top:4px"><button class="btn btn--mini btn--ghost" id="wAgain">${esc(t('f_again'))}</button></div>`;
    }
  }
  html += `<div class="hint">${esc(t('kb_hint'))}</div>`;
  body.innerHTML = html;

  const pick = e => {
    S.refOverride.set(w.key, fmt(e, w.year)); S.origin.set(w.key, 'auto');
    const u = entryLink(e); if (u) S.link.set(w.key, u); else S.link.delete(w.key);
    S.changing.delete(w.key); render();
  };
  body.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => pick(cands[+b.dataset.pick]));
  body.querySelectorAll('[data-pickdoi]').forEach(b => b.onclick = () => pick(doiC));
  if ($('useBib')) $('useBib').onclick = () => {
    S.refOverride.delete(w.key); S.origin.delete(w.key); S.link.delete(w.key);
    S.changing.delete(w.key); render(); };
  if ($('wChange')) $('wChange').onclick = () => { S.changing.add(w.key); render();
    if (!S.cands.has(w.key)) autoLookup(w); };
  if ($('wEdit')) $('wEdit').onclick = () => { S.manualOpen = true; render(); setTimeout(()=>$('manBox')?.focus(),20); };
  if ($('wClear')) $('wClear').onclick = () => { S.refOverride.delete(w.key); S.origin.delete(w.key);
    S.link.delete(w.key); render(); };
  if ($('wAgain')) $('wAgain').onclick = () => { S.cands.delete(w.key); render(); autoLookup(w); };
  if ($('manOpen')) $('manOpen').onclick = () => { S.manualOpen = true; S.refineOpen = null; render(); setTimeout(()=>$('manBox')?.focus(),20); };
  if ($('manCancel')) $('manCancel').onclick = () => { S.manualOpen = false; render(); };
  if ($('manSave')) $('manSave').onclick = () => {
    const v = $('manBox').value.trim(); if (!v){ toast(t('t_missing')); return; }
    S.refOverride.set(w.key, esc(v).replace(/_([^_]+)_/g,'<em>$1</em>'));
    S.origin.set(w.key, 'mano'); S.manualOpen = false; S.changing.delete(w.key); render(); };

  /* refinar búsqueda: suma tus propias palabras clave a las que ya saca
     del contexto, con más peso, y vuelve a consultar las mismas fuentes */
  if ($('refOpen')) $('refOpen').onclick = () => { S.refineOpen = w.key; S.manualOpen = false; render();
    setTimeout(()=>$('refBox')?.focus(),20); };
  if ($('refCancel')) $('refCancel').onclick = () => { S.refineOpen = null; render(); };
  if ($('refGo')) $('refGo').onclick = () => {
    const v = $('refBox').value.trim();
    if (v) S.refineKw.set(w.key, v); else S.refineKw.delete(w.key);
    S.refineOpen = null; S.cands.delete(w.key); render(); autoLookup(w);
  };
  if ($('refBox')) $('refBox').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); $('refGo').click(); } });

  if ($('idFetch')) $('idFetch').onclick = async () => {
    const btn = $('idFetch'), raw = $('idBox').value.trim(); if (!raw) return;
    btn.disabled = true; btn.textContent = t('m_fetching');
    let r = null;
    try { r = await resolveIdent(raw); } catch(e){}
    btn.disabled = false; btn.textContent = t('m_fetch');
    if (!r){ toast(t('m_notfound')); return; }
    if (r.link) S.link.set(w.key, r.link);
    if (r.entry && r.entry.fields.title){
      S.doiCand.set(w.key, r.entry); S.changing.add(w.key); render(); toast(t('m_filled'));
    } else toast(t('m_linkonly'));
  };
  if ($('idBox')) $('idBox').addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); $('idFetch').click(); } });
}
const optBox = (tagKey, ref, cls, acts, ok) =>
  `<div class="opt ${cls}"><div class="opt-tag"><span class="${ok?'ok':''}">${esc(t(tagKey))}</span></div>
   <div class="opt-ref">${ref}</div><div class="opt-acts">${acts}</div></div>`;

async function autoLookup(w){
  if (!Object.values(CFG.sources).some(Boolean)) return;
  const token = ++S.lookupToken;
  S.busyKey = w.key; renderDetail();
  let items = [];
  try { items = await lookup(w); } catch(e){ items = []; }
  if (token !== S.lookupToken) return;   // cambiaste de cita: el resultado viejo se descarta
  S.cands.set(w.key, items); S.busyKey = null;
  render();
}

   ========================================================================= */
function cleanRef(html){
  const d = document.createElement('div'); d.innerHTML = html;
  (function walk(n){
    [...n.childNodes].forEach(c => {
      if (c.nodeType !== 1) return;
      const tag = c.tagName.toLowerCase();
      if (tag === 'br'){ c.replaceWith(document.createTextNode(' ')); return; }
      walk(c);
      if (tag === 'i'){ const e = document.createElement('em'); e.append(...c.childNodes); c.replaceWith(e); }
      else if (tag !== 'em'){ c.replaceWith(...c.childNodes); }
    });
  })(d);
  return d.innerHTML.replace(/\s+/g,' ').trim();
}
/* Los lugares con año no vienen solos: Rosario 2006, Porto Alegre 2007, Belém 2009.
   Cuando quitás uno, ofrecemos limpiar de una todos los del mismo nombre. */
const sameName = (name, exceptKey) =>
  S.works.filter(w => w.key !== exceptKey && slug(w.authors) === slug(name));
function askBulk(head, body, oneLabel, allLabel, onOne, onAll){
  const v = modal(`<h3>${esc(head)}</h3><p class="mini-note">${esc(body)}</p>
    <div class="row"><button class="btn btn--ghost" id="bkOne">${esc(oneLabel)}</button>
    <button class="btn btn--key" id="bkAll">${esc(allLabel)}</button></div>`);
  $('bkOne').onclick = () => { v.remove(); onOne(); };
  $('bkAll').onclick = () => { v.remove(); onAll(); };
}
function dropWork(w){
  const drop = list => {
    const ids = new Set(list.flatMap(x => x.hits.map(h => h.id)));
    S.hits = S.hits.filter(h => !ids.has(h.id));
    list.forEach(x => { S.refOverride.delete(x.key); S.origin.delete(x.key); S.link.delete(x.key); });
    if (S.sel && list.some(x => x.key === S.sel.key)) S.sel = null;
    render();
  };
  const others = sameName(w.authors, w.key);
  if (!others.length) return drop([w]);
  askBulk(t('bulk_h'), t(others.length===1?'bulk_p1':'bulk_p', w.authors, others.length), t('bulk_one'), t('bulk_all'),
    () => drop([w]), () => drop([w, ...others]));
}
function dropSug(h){
  const others = S.hits.filter(x => x.status === 'sug' && x.id !== h.id && slug(x.authors) === slug(h.authors));
  const drop = list => { const ids = new Set(list.map(x => x.id));
    S.hits = S.hits.filter(x => !ids.has(x.id)); S.sel = null; render(); };
  if (!others.length) return drop([h]);
  askBulk(t('bulk_h'), t(others.length===1?'bulk_p1':'bulk_p', h.authors, others.length), t('bulk_one'), t('bulk_all'),
    () => drop([h]), () => drop([h, ...others]));
}
function keepSug(h){
  const others = S.hits.filter(x => x.status === 'sug' && x.id !== h.id && slug(x.authors) === slug(h.authors));
  const keep = list => { list.forEach(x => x.status = 'ok');
    S.sel = {kind:'work', key: slug(h.authors)+'|'+slug(h.year)}; render(); };
  if (!others.length) return keep([h]);
  askBulk(t('bulk_kh'), t(others.length===1?'bulk_kp1':'bulk_kp', h.authors, others.length), t('bulk_one'), t('bulk_all'),
    () => keep([h]), () => keep([h, ...others]));
}

function bindCommon(b){
  b.querySelectorAll('[data-jump]').forEach(x => x.onclick = e => { e.stopPropagation(); jumpTo(x.dataset.jump); });
  b.querySelectorAll('[data-cycle]').forEach(x => x.onclick = e => { e.stopPropagation();

  b.querySelectorAll('[data-cyclenorm]').forEach(x => x.onclick = e => { e.stopPropagation();
    const n = S.norms.find(y => y.key===x.dataset.cyclenorm); if (n) cycleTo(n.key, n.hits); });
  b.querySelectorAll('[data-killwork]').forEach(x => x.onclick = e => { e.stopPropagation();

}

function recount(){
  S.works = groupWorks(S.hits);
  S.norms = groupNorms(S.hits);
  S.works.forEach(w => {

    w.bib = m ? m.entry : null; w.ambiguous = m ? m.ambiguous : false; w.alts = m ? m.alts : null;
  });
  const sug = S.hits.filter(h => h.status==='sug').length;

  $('counters').innerHTML =
    `<div class="count"><b>${S.works.length}</b><span>${t('c_works')}</span></div>` +
    `<div class="count"><b>${S.hits.filter(h=>h.status==='ok'&&h.kind!=='ley').length}</b><span>${t('c_mentions')}</span></div>` +
