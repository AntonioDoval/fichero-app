   ========================================================================= */
function paraOffset(pEl, node, offset){
  let acc = 0, done = false;
  (function walk(n){
    if (done) return;
    if (n === node && n.nodeType === 3){ acc += offset; done = true; return; }
    if (n.nodeType === 3){ acc += n.nodeValue.length; return; }
    for (const c of n.childNodes){ walk(c); if (done) return; }
  })(pEl);
  return acc;
}
function showPop(rect, html){
  const pop = $('pop'); pop.innerHTML = html; pop.classList.remove('hidden');
  pop.style.top = (window.scrollY + rect.top - 40)+'px';
  pop.style.left = Math.max(8, window.scrollX + rect.left)+'px';
}
function onSelect(){
  const sel = window.getSelection(), pop = $('pop');
  if (!sel || sel.isCollapsed || !sel.rangeCount){ pop.classList.add('hidden'); return; }
  const r = sel.getRangeAt(0);
  const a = r.startContainer.parentElement?.closest('[data-p]');
  const b = r.endContainer.parentElement?.closest('[data-p]');
  if (!a || a !== b){ pop.classList.add('hidden'); return; }
  const txt = sel.toString().trim();
  if (!txt || txt.length > 160){ pop.classList.add('hidden'); return; }
  const pi = +a.dataset.p;
  const st = paraOffset(a, r.startContainer, r.startOffset);
  const en = paraOffset(a, r.endContainer, r.endOffset);
  showPop(r.getBoundingClientRect(), `<button class="btn btn--mini btn--keep" id="popAdd">${esc(t('mark_cite'))}</button>`);
  $('popAdd').onclick = () => { addManual(pi, st, en, txt); pop.classList.add('hidden'); sel.removeAllRanges(); };
}
function addManual(pi, st, en, txt){
  const push = (a, y) => {
    S.hits.push(mkHit(pi, st, en, a, y, 'manual', 'ok'));
    S.hits.sort((x,z) => x.para-z.para || x.start-z.start);
    S.sel = {kind:'work', key: slug(a)+'|'+slug(y)};
    render();
  };
  const g = txt.replace(/^[(\[]|[)\]]$/g,'').trim().match(RE_LOOSE);
  if (g){ push(tidyAuthors(trimStop(g[1])) || g[1], normYear(g[2])); return; }
  const gy = (txt.match(/\b(\d{4}[a-h]?)\b/)||[])[1] || '';
  const ga = trimStop(txt.replace(/[(\[\])]/g,'').replace(/\b\d{4}[a-h]?\b[\s\S]*$/,'').replace(/[,;:]\s*$/,'').trim());
  const v = modal(`<h3>${esc(t('add_h'))}</h3>
    <p class="mini-note">${esc(t('add_sel', txt))}</p>
    <div class="two"><div><label>${esc(t('ed_authors'))}</label><input type="text" id="aA" value="${esc(ga)}"></div>
    <div><label>${esc(t('ed_year'))}</label><input type="text" id="aY" value="${esc(gy)}"></div></div>
    <div class="row"><button class="btn btn--ghost" id="aC">${esc(t('cancel'))}</button>
    <button class="btn btn--key" id="aO">${esc(t('add_btn'))}</button></div>`);
  $('aA').focus();
  $('aC').onclick = () => v.remove();
  $('aO').onclick = () => {
    const a = $('aA').value.trim(), y = $('aY').value.trim();
    if (!a || !y){ toast(t('t_missing')); return; }
    v.remove(); push(tidyAuthors(a), normYear(y));
  };
}

  .replace(/[\u2018\u2019\u02BC]/g,'\u2019').replace(/[\u201C\u201D]/g,'"')

async function loadDocx(file){
  if (!window.mammoth){ toast(t('t_docx_err')); return; }
  try {
    const res = await window.mammoth.convertToHtml({arrayBuffer: await file.arrayBuffer()});
    const box = document.createElement('div'); box.innerHTML = res.value;
    const paras = [...box.querySelectorAll('p,h1,h2,h3,h4,li,blockquote')].map(el => ({
      tag: /^H[1-3]$/.test(el.tagName) ? el.tagName.toLowerCase() : 'p',
      text: normalizeText(el.textContent||'') }));
    if (!paras.length){ toast(t('t_no_text')); return; }
    loadParas(paras);
  } catch(e){ console.error(e); toast(t('t_docx_err')); }

(function initResizers(){

  const apply = () => {
    $('colList').style.width = S.w2 + 'px';

    if (drag === 'rz1') S.w2 = cl(fromRight - S.w3 - 14, 260, 520);

    apply();
  };
  const stop = () => { if (!drag) return;
    document.getElementById(drag).classList.remove('is-dragging'); drag = null;
    document.body.style.userSelect=''; document.body.style.cursor=''; saveSoon(); };
  ['rz1','rz2'].forEach(id => {
    const start = e => {
      if (window.innerWidth <= 1150 && id === 'rz2') return;
      if (window.innerWidth <= 820) return;
      drag = id; $(id).classList.add('is-dragging');
      document.body.style.userSelect='none'; document.body.style.cursor='col-resize';
      if (e.cancelable) e.preventDefault();
    };
    $(id).addEventListener('mousedown', start);
    $(id).addEventListener('touchstart', start, {passive:false});
    $(id).addEventListener('dblclick', () => { if (id==='rz1') S.w2 = 320; else S.w3 = 400; apply(); saveSoon(); });
  });
  document.addEventListener('mousemove', move);
  document.addEventListener('touchmove', move, {passive:true});
  document.addEventListener('mouseup', stop);
  document.addEventListener('touchend', stop);
})();

/* ---------------------------------------------------------------- arranque */
const hadSession = restore();
applyI18n();
render();
if (hadSession){
  $('empty').classList.add('hidden');
  setTimeout(() => toast(t('t_session', S.works.length)), 500);
} else if (!DB.ok){ setTimeout(() => flashSaved(''), 800); }
window.addEventListener('beforeunload', () => { clearTimeout(saveTimer); try { saveNow(); } catch(e){} });

</script>
